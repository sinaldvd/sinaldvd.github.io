<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Media Server Express</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <script async src="https://sinaldvd.github.io/test/static/js/core.js"></script>
    <script async src="https://sinaldvd.github.io/test/static/js/p2p-graph.js"></script>
    <script src="https://sinaldvd.github.io/test/static/js/d3.min.js"></script>
    <script async src="https://sinaldvd.github.io/test/static/js/rickshaw.min.js"></script>

    <link rel="stylesheet" href="https://sinaldvd.github.io/test/static/js/rickshaw.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        const URL_P2P_MEDIA_LOADER_HLSJS = "https://sinaldvd.github.io/test/static/js/peerpool.js";
        const URL_P2P_MEDIA_LOADER_SHAKA = "https://sinaldvd.github.io/test/static/js/peerpool.js";
    </script>

    <style>
        body {
            font: normal 400 16px 'Inter', sans-serif;
            color: #fff;
            background: #000;
            margin: 1em 0 3em;
        }

        .container {
            padding: 0 15px;
            margin: 0 auto;
            max-width: 1140px;
        }

        #video { width: 100%; }

        .wrapper {
            display: flex;
            flex-wrap: wrap;
        }

        .column-1 { width: 100%; }

        .column-2 {
            width: 100%;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1em;
        }

        .form-control {
            width: 100%;
            padding: .75em;
            border-radius: .25em;
            border: 1px solid #333;
        }

        .form-button {
            padding: .75em 1em;
            border: none;
            border-radius: .25em;
            background: #972e2d;
            color: white;
            cursor: pointer;
            margin-right: 10px;
        }

        .form-button:hover {
            background: #c60000;
        }

        #video_container { width: 100%; }

        #chart {
            padding-top: 5px;
            height: 150px;
            overflow: hidden;
            background: rgba(255,255,255,.05);
            border-radius: 10px;
        }

        .hide { display:none; }
    </style>
</head>
<body>
<div class="container">
    <div id="main-view">
        <div id="error-webrtc-data-channels" class="hide">WebRTC não suportado</div>
        <div id="error-hls-js" class="hide">HLS.js não suportado</div>

        <div class="wrapper">
            <div id="video_container"></div>

            <div class="column-1">
                <div id="chart_container">
                    <div id="legend"></div>
                    <div id="legend-totals"></div>
                    <div id="chart"></div>
                </div>
            </div>

            <div class="column-2">
                <form id="videoUrlForm">
                    <div class="form-group">
                        <label>Video URL:</label>
                        <input
                            type="text"
                            class="form-control"
                            id="url"
                            value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
                        />
                    </div>

                    <div class="form-group">
                        <label>Player:</label>
                        <select class="form-control" id="type">
                            <option value="hlsjs" selected>Hls.js</option>
                            <option value="clappr">Clappr</option>
                        </select>
                    </div>

                    <button type="submit" class="form-button">Apply</button>
                </form>

                <div id="graph"></div>
            </div>
        </div>
    </div>
</div>

<script>
function waitForGlobalObject(objectName, objectNextName) {
    return new Promise((resolve) => {
        function check() {
            if (
                window[objectName] !== undefined &&
                (objectNextName === undefined || window[objectName][objectNextName] !== undefined)
            ) {
                resolve();
            } else {
                setTimeout(check, 200);
            }
        }
        check();
    });
}

function loadScript(src) {
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.onload = resolve;
        script.onerror = reject;
        script.src = src;
        document.head.appendChild(script);
    });
}

class DemoApp {
    async init() {
        await waitForGlobalObject("p2pml", "core");

        this.isP2PSupported = p2pml.core.HybridLoader.isSupported();

        if (!this.isP2PSupported) {
            document.querySelector("#error-webrtc-data-channels").classList.remove("hide");
        }

        this.videoContainer = document.getElementById("video_container");
        this.videoUrl = document.getElementById("url").value;
        this.playerType = document.getElementById("type").value;

        await waitForGlobalObject("Rickshaw");
        await waitForGlobalObject("P2PGraph");

        this.graph = new P2PGraph("#graph");
        this.graph.add({ id: "me", name: "You", me: true });

        this.initChart();
        this.restartDemo();

        document.getElementById("videoUrlForm").addEventListener("submit", (e) => {
            e.preventDefault();
            this.videoUrl = document.getElementById("url").value;
            this.playerType = document.getElementById("type").value;
            this.restartDemo();
        });
    }

    async restartDemo() {
        this.videoContainer.innerHTML = "";

        await loadScript("https://cdn.jsdelivr.net/npm/hls.js@latest");
        await loadScript(URL_P2P_MEDIA_LOADER_HLSJS);

        this.engine = new p2pml.hlsjs.Engine();

        this.initHlsJsPlayer();
    }

    initHlsJsPlayer() {
        const video = document.createElement("video");
        video.id = "video";
        video.controls = true;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;

        this.videoContainer.appendChild(video);

        const hls = new Hls({
            loader: this.engine.createLoaderClass()
        });

        p2pml.hlsjs.initHlsJsPlayer(hls);

        hls.loadSource(this.videoUrl);
        hls.attachMedia(video);
    }

    initChart() {
        this.chart = new Rickshaw.Graph({
            element: document.querySelector("#chart"),
            renderer: "line",
            series: [
                {
                    color: "rgba(59,195,243,1)",
                    data: Array(50).fill().map((_, i) => ({ x: i, y: 0 }))
                }
            ]
        });

        this.chart.render();
    }
}

window.demo = new DemoApp();
window.demo.init();
</script>
</body>
</html>
