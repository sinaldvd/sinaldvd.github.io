<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://sinaldvd.github.io" crossorigin>
    <link rel="preconnect" href="https://sinalpublicoetv.vercel.app" crossorigin>
    <link rel="preconnect" href="https://t5r4e3w2q1y0-cloudflare-net.vercel.app" crossorigin>
    <link rel="preconnect" href="https://code.jquery.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/clappr/dash-shaka-playback@latest/dist/dash-shaka-playback.external.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/clappr/clappr-level-selector-plugin@latest/dist/level-selector.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr-pip@latest/dist/clappr-pip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.14.10/dist/shaka-player.compiled.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-core@0.6.2/build/p2p-media-loader-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-hlsjs@0.6.2/build/p2p-media-loader-hlsjs.min.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Roboto', Arial, Helvetica, sans-serif;
        }
        #player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #player {
            width: 100%;
            height: 100%;
        }

        /* Botões flutuantes */
        .fab {
            position: absolute;
            bottom: 20px;
            width: 50px;
            height: 50px;
            z-index: 200;
        }
        .fab.left { left: 20px; }
        .fab.right { right: 20px; }
        .fab button {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="player-wrapper">
        <div id="player"></div>
    </div>

    <script>
        // Função para ler query string
        function q(name, fallback = null) {
            const m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.href);
            return m ? decodeURIComponent(m[1]) : fallback;
        }

        const canalId = q("id") || q("canal");
        if (!canalId) {
            document.body.innerHTML = `<h2 style="color:#fff;text-align:center;margin-top:50px">
                                        Canal não informado.<br>Use ?id= ou ?canal=
                                        </h2>`;
            throw new Error("Canal não informado");
        }

        const posterUrl = `https://img.faz-o-eli.online/${canalId}.prev.png`;
        const SRC = q('src', `https://t5r4e3w2q1y0-cloudflare-net.vercel.app/${canalId}.m3u8`);
        const TITLE = q('title', 'Player ao Vivo');
        const WANT_LEVEL = Number(q('level', -1));

        // Inicializando Clappr (HLS simples)
        const player = new Clappr.Player({
            source: SRC,
            poster: posterUrl,
            parentId: '#player',
            autoPlay: false,
            width: '100%',
            height: '100%',
            mediacontrol: { 
                seekbar: '#ff1500',
                buttons: '#ffffff'
            },
            plugins: [Clappr.LevelSelector, Clappr.Pip],
            playback: {
                hlsjsConfig: {
                    startLevel: WANT_LEVEL
                }
            }
        });

        console.log('%c✅ Player carregado com sucesso!', 'color:#00ff9d;font-weight:bold;font-size:14px');

        // Keep awake
        async function keepAwake(on) {
            if (!('wakeLock' in navigator)) return;
            try {
                if (on) await navigator.wakeLock.request('screen');
            } catch (e) {}
        }
        keepAwake(true);
        document.addEventListener('visibilitychange', () => keepAwake(!document.hidden));

        // Fullscreen orientation lock
        player.on(Clappr.Events.PLAYER_FULLSCREEN, () => {
            screen.orientation?.lock('landscape').catch(() => {});
        });
        player.on(Clappr.Events.PLAYER_EXIT_FULLSCREEN, () => {
            screen.orientation?.unlock().catch(() => {});
        });
    </script>

</body>
</html>
