    <div id="player"></div>

    <script>
    (function () {
        "use strict";

        const params = new URLSearchParams(window.location.search);
        const rawId = params.get("id") || params.get("m");

        // Validação do ID
        if (!rawId || !/^[a-zA-Z0-9_-]+$/.test(rawId)) {
            document.body.innerHTML = `
                <div class="error-screen">
                    <h2>Canal não informado ou inválido</h2>
                    <p>Use a URL com o parâmetro:<br><strong>?id=nome-do-canal</strong></p>
                </div>`;
            return;
        }

        const canalId = rawId;

        // Fontes (ordem de prioridade)
        const sources = [
            `https://m8q2v7r4k1-cloudflare-net.vercel.app/${canalId}.m3u8`,
            `https://a9b8c7d6e5f4-cloudflare-net.vercel.app/${canalId}.m3u8`,
            `https://t5r4e3w2q1y0-cloudflare-net.vercel.app/${canalId}.m3u8`
        ];

        let currentSourceIndex = 0;
        let player = null;
        let reconnectTimer = null;
        let initialLoadTimer = null;
        let bufferingTimer = null;
        let retryCount = 0;
        const MAX_RETRIES = 10;

        const poster = `https://img.faz-o-eli.online/${canalId}.prev.png`;

        function clearAllTimers() {
            clearTimeout(reconnectTimer);
            clearTimeout(initialLoadTimer);
            clearTimeout(bufferingTimer);
        }

        function destroyPlayer() {
            if (player) {
                try { player.destroy(); } catch (e) {}
                player = null;
            }
        }

        function showFatalError(message) {
            clearAllTimers();
            destroyPlayer();
            document.body.innerHTML = `
                <div class="error-screen">
                    <h2>Erro na Transmissão</h2>
                    <p>${message}</p>
                    <p style="margin-top:16px;font-size:13px;opacity:0.6;">Recarregue a página ou tente novamente mais tarde.</p>
                </div>`;
        }

        function createPlayer() {
            clearAllTimers();

            if (retryCount >= MAX_RETRIES) {
                showFatalError("Não foi possível conectar ao stream após várias tentativas.");
                return;
            }

            destroyPlayer();

            const activeSource = sources[currentSourceIndex];
            const plugins = [];

            if (typeof LevelSelector !== "undefined") plugins.push(LevelSelector);
            if (typeof ClapprPip !== "undefined") plugins.push(ClapprPip);
            if (typeof ChromecastPlugin !== "undefined") plugins.push(ChromecastPlugin);

            try {
                player = new Clappr.Player({
                    parentId: "#player",
                    source: activeSource,
                    poster: poster,
                    width: "100%",
                    height: "100%",
                    autoPlay: true,
                    mute: false,
                    mediainfo: {
                        title: canalId,
                        description: "Live TV"
                    },
                    plugins: plugins,
                    playback: {
                        playInline: true,
                        recycleVideo: true,
                        hlsjsConfig: {
                            enableWorker: true,
                            lowLatencyMode: true,
                            liveSyncDurationCount: 3,
                            liveMaxLatencyDurationCount: 10,
                            maxBufferLength: 20,
                            maxMaxBufferLength: 35,
                            maxBufferHole: 0.5,
                            backBufferLength: 20,
                            fragLoadingMaxRetry: 5,
                            manifestLoadingMaxRetry: 5,
                            levelLoadingMaxRetry: 5,
                            xhrSetup: function (xhr) {
                                xhr.withCredentials = false;
                            }
                        }
                    },
                    chromecast: {
                        appId: "9DFB77C0",
                        media: {
                            title: canalId,
                            subtitle: "Live TV"
                        }
                    }
                });

                // Timeout de carregamento inicial
                initialLoadTimer = setTimeout(() => {
                    retryCount++;
                    reconnect();
                }, 14000);

                player.on(Clappr.Events.PLAYER_PLAY, () => {
                    clearAllTimers();
                    retryCount = 0;
                });

                player.on(Clappr.Events.PLAYBACK_BUFFERING, () => {
                    clearTimeout(initialLoadTimer);
                    bufferingTimer = setTimeout(() => {
                        retryCount++;
                        reconnect();
                    }, 20000);
                });

                player.on(Clappr.Events.PLAYBACK_BUFFERFULL, () => {
                    clearTimeout(bufferingTimer);
                });

                const handleError = () => {
                    retryCount++;
                    reconnect();
                };

                player.on(Clappr.Events.PLAYER_ERROR, handleError);
                player.on(Clappr.Events.PLAYBACK_ERROR, handleError);

            } catch (e) {
                console.error("Erro ao criar player:", e);
                retryCount++;
                reconnect();
            }
        }

        function reconnect() {
            clearAllTimers();

            if (retryCount >= MAX_RETRIES) {
                showFatalError("Tente recarregar a página.");
                return;
            }

            // Alterna para a próxima fonte
            currentSourceIndex = (currentSourceIndex + 1) % sources.length;

            const delay = Math.min(2500 + (retryCount * 800), 7000);
            reconnectTimer = setTimeout(createPlayer, delay);
        }

        // Reconecta quando a internet volta
        window.addEventListener("online", () => {
            retryCount = 0;
            currentSourceIndex = 0;
            createPlayer();
        });

        window.addEventListener("beforeunload", () => {
            clearAllTimers();
            destroyPlayer();
        });

        // Inicia o player
        createPlayer();
    })();
</script>
