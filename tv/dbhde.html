<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>cPlayer</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Clappr + Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/clappr-pip@latest/dist/clappr-pip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/clappr-chromecast-plugin@latest/dist/clappr-chromecast-plugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/clappr/clappr-level-selector-plugin@latest/dist/level-selector.min.js"></script>

  <!-- P2P Media Loader (versão atual) -->
  <script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-hlsjs@latest/dist/p2p-media-loader-hlsjs.iife.min.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }
    #player {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
    }
  </style>
</head>
<body>
  <div id="player"></div>

  <script>
  (function () {
    "use strict";

    const params = new URLSearchParams(window.location.search);
    const rawId = params.get("id") || params.get("m");
    const isValidId = (str) => /^[a-zA-Z0-9_-]+$/.test(str);

    if (!rawId || !isValidId(rawId)) {
      document.body.innerHTML = `
        <div style="color:#fff;text-align:center;padding:20px;font-family:sans-serif;position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000;">
          <h2 style="color:#ff4444;margin-bottom:10px;">Canal não informado ou inválido</h2>
          <p>Use a URL com o parâmetro: <strong>?id=nome-do-canal</strong></p>
        </div>`;
      return;
    }

    const canalId = rawId;

    const sources = [
      `https://m8q2v7r4k1-cloudflare-net.vercel.app/${canalId}.m3u8`,
      `https://a9b8c7d6e5f4-cloudflare-net.vercel.app/${canalId}.m3u8`,
      `https://t5r4e3w2q1y0-cloudflare-net.vercel.app/${canalId}.m3u8`
    ];

    let currentSourceIndex = 0;
    const poster = `https://img.faz-o-eli.online/${canalId}.prev.png`;

    let player = null;
    let p2pEngine = null;
    let reconnectTimer = null;
    let initialLoadTimer = null;
    let bufferingTimer = null;
    let retryCount = 0;
    let isReconnecting = false;
    const MAX_RETRIES = 8;

    function clearAllTimers() {
      clearTimeout(reconnectTimer);
      clearTimeout(initialLoadTimer);
      clearTimeout(bufferingTimer);
    }

    function destroyPlayer() {
      if (player) {
        try { player.destroy(); } catch (e) {}
        player = null;
      }
    }

    function showFatalError(message) {
      clearAllTimers();
      destroyPlayer();
      isReconnecting = false;
      document.body.innerHTML = `
        <div style="color:#fff;text-align:center;padding:20px;font-family:sans-serif;position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000;z-index:999;">
          <h2 style="color:#ff4444;margin-bottom:10px;">Erro na Transmissão</h2>
          <p>${message}</p>
          <p style="margin-top:12px;opacity:.7;font-size:14px;">Recarregue a página ou tente novamente mais tarde.</p>
        </div>`;
    }

    function initP2P() {
      // Nova API da biblioteca
      if (typeof p2pml === "undefined" || !p2pml.hlsjs || !p2pml.hlsjs.HlsJsP2PEngine) {
        console.warn("⚠️ p2pml.HlsJsP2PEngine não encontrado. Rodando sem P2P.");
        return null;
      }

      try {
        const engine = new p2pml.hlsjs.HlsJsP2PEngine({
          core: {
            swarmId: canalId,
            announceTrackers: [
              "wss://tracker.openwebtorrent.com",
              "wss://tracker.webtorrent.dev",
              "wss://tracker.novage.com.ua/announce"
            ],
            rtcConfig: {
              iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun.cloudflare.com:3478" }
              ]
            }
          }
        });

        console.log("✅ P2P Engine (nova API) iniciado");
        return engine;
      } catch (err) {
        console.warn("❌ Erro ao iniciar P2P:", err);
        return null;
      }
    }

    function createPlayer() {
      if (isReconnecting) return;

      clearAllTimers();
      destroyPlayer();

      if (retryCount >= MAX_RETRIES) {
        showFatalError("Não foi possível conectar após várias tentativas.");
        return;
      }

      const activeSource = sources[currentSourceIndex];
      console.log(`🔄 Tentando fonte ${currentSourceIndex + 1}/${sources.length}`);

      if (!p2pEngine) {
        p2pEngine = initP2P();
      }

      const plugins = [];
      if (typeof LevelSelector !== "undefined") plugins.push(LevelSelector);
      if (typeof ClapprPip !== "undefined") plugins.push(ClapprPip);
      if (typeof ChromecastPlugin !== "undefined") plugins.push(ChromecastPlugin);

      // Configuração do loader P2P (nova API)
      let hlsjsConfig = {
        enableWorker: true,
        lowLatencyMode: true,
        liveSyncDurationCount: 3,
        liveMaxLatencyDurationCount: 8,
        maxBufferLength: 20,
        maxMaxBufferLength: 35,
        backBufferLength: 20,
        startLevel: -1,
        autoStartLoad: true,
        maxBufferHole: 0.8,
        fragLoadingMaxRetry: 6,
        manifestLoadingMaxRetry: 5,
        levelLoadingMaxRetry: 5
      };

      // Se o P2P iniciou, tenta usar o loader dele
      if (p2pEngine && typeof p2pEngine.createLoaderClass === "function") {
        hlsjsConfig.loader = p2pEngine.createLoaderClass();
      }

      try {
        player = new Clappr.Player({
          parentId: "#player",
          source: activeSource,
          poster: poster,
          width: "100%",
          height: "100%",
          autoPlay: true,
          mute: false,
          mediainfo: {
            title: canalId,
            description: "Live TV"
          },
          plugins: plugins,
          playback: {
            playInline: true,
            recycleVideo: true,
            hlsjsConfig: hlsjsConfig
          },
          chromecast: {
            appId: "9DFB77C0",
            media: {
              title: canalId,
              subtitle: "Live TV"
            }
          }
        });

        initialLoadTimer = setTimeout(() => {
          console.warn("⏰ Timeout inicial");
          scheduleReconnect();
        }, 12000);

        player.on(Clappr.Events.PLAYER_PLAY, () => {
          clearAllTimers();
          retryCount = 0;
          isReconnecting = false;
          console.log("▶️ Player tocando");
        });

        player.on(Clappr.Events.PLAYBACK_BUFFERING, () => {
          clearTimeout(initialLoadTimer);
          bufferingTimer = setTimeout(() => {
            console.warn("⏰ Buffering longo");
            scheduleReconnect();
          }, 18000);
        });

        player.on(Clappr.Events.PLAYBACK_BUFFERFULL, () => {
          clearTimeout(bufferingTimer);
        });

        player.on(Clappr.Events.PLAYER_ERROR, () => scheduleReconnect());
        player.on(Clappr.Events.PLAYBACK_ERROR, () => scheduleReconnect());

      } catch (e) {
        console.error("Erro ao criar player:", e);
        scheduleReconnect();
      }
    }

    function scheduleReconnect() {
      if (isReconnecting) return;
      isReconnecting = true;

      clearAllTimers();
      retryCount++;

      if (retryCount >= MAX_RETRIES) {
        showFatalError("Tente recarregar a página.");
        return;
      }

      currentSourceIndex = (currentSourceIndex + 1) % sources.length;
      const delay = Math.min(3000 + retryCount * 1000, 10000);

      console.log(`🔄 Reconectando em ${delay}ms (tentativa ${retryCount})`);

      reconnectTimer = setTimeout(() => {
        isReconnecting = false;
        createPlayer();
      }, delay);
    }

    window.addEventListener("online", () => {
      console.log("🌐 Internet voltou");
      retryCount = 0;
      currentSourceIndex = 0;
      isReconnecting = false;
      createPlayer();
    });

    createPlayer();

  })();
  </script>
</body>
</html>
