<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Player</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <!-- Clappr + Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/clappr-pip@latest/dist/clappr-pip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/clappr-chromecast-plugin@latest/dist/clappr-chromecast-plugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/clappr/clappr-level-selector-plugin@latest/dist/level-selector.min.js"></script>

  <!-- P2P Media Loader (versão que funciona) -->
  <script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-hlsjs@latest/dist/p2p-media-loader-hlsjs.iife.min.js"></script>

  <!-- Chromecast -->
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    #player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="player"></div>

  <script>
  (function () {
    "use strict";

    const params = new URLSearchParams(window.location.search);
    const rawId = params.get("id") || params.get("m");
    const isValidId = (str) => /^[a-zA-Z0-9_-]+$/.test(str);

    if (!rawId || !isValidId(rawId)) {
      document.body.innerHTML = `
        <div style="color:#fff;text-align:center;padding:20px;font-family:sans-serif;position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000;">
          <h2 style="color:#ff4444;margin-bottom:10px;">Canal não informado ou inválido</h2>
          <p>Use a URL com o parâmetro: <strong>?id=nome-do-canal</strong></p>
        </div>`;
      return;
    }

    const canalId = rawId;

    const sources = [
      `https://m8q2v7r4k1-cloudflare-net.vercel.app/${canalId}.m3u8`,
      `https://a9b8c7d6e5f4-cloudflare-net.vercel.app/${canalId}.m3u8`,
      `https://t5r4e3w2q1y0-cloudflare-net.vercel.app/${canalId}.m3u8`
    ];

    let currentSourceIndex = 0;
    const poster = `https://img.faz-o-eli.online/${canalId}.prev.png`;

    let player = null;
    let p2pEngine = null;
    let reconnectTimer = null;
    let initialLoadTimer = null;
    let bufferingTimer = null;
    let retryCount = 0;
    const MAX_RETRIES = 12;

    const stats = {
      peers: 0,
      p2pSegments: 0,
      httpSegments: 0,
      get p2pPercent() {
        const total = this.p2pSegments + this.httpSegments;
        return total === 0 ? 0 : ((this.p2pSegments / total) * 100).toFixed(1);
      }
    };

    function clearAllTimers() {
      clearTimeout(reconnectTimer);
      clearTimeout(initialLoadTimer);
      clearTimeout(bufferingTimer);
    }

    function destroyPlayer() {
      if (player) {
        try { player.destroy(); } catch (e) {}
        player = null;
      }
    }

    function showFatalError(message) {
      clearAllTimers();
      destroyPlayer();
      document.body.innerHTML = `
        <div style="color:#fff;text-align:center;padding:20px;font-family:sans-serif;position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000;z-index:999;">
          <h2 style="color:#ff4444;margin-bottom:10px;">Erro na Transmissão</h2>
          <p>${message}</p>
          <p style="margin-top:12px;opacity:.7;font-size:14px;">Recarregue a página ou tente novamente mais tarde.</p>
        </div>`;
    }

    function initP2P() {
      if (typeof p2pml === "undefined" || !p2pml.hlsjs) {
        console.warn("⚠️ Biblioteca p2pml não encontrada. Rodando sem P2P.");
        return null;
      }

      try {
        const engine = new p2pml.hlsjs.Engine({
          segments: {
            swarmId: canalId
          },
          loader: {
            trackerAnnounce: [
              "wss://tracker.openwebtorrent.com",
              "wss://tracker.webtorrent.dev",
              "wss://tracker.novage.com.ua/announce"
            ],
            rtcConfig: {
              iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun.cloudflare.com:3478" }
              ]
            },
            httpDownloadEnabled: true,
            httpDownloadProbability: 0.07,
            requiredSegmentsPriority: 1,
            maxPeers: 70,
            simultaneousP2PDownloads: 12,
            simultaneousHttpDownloads: 2,
            cachedSegmentsCount: 1200,
            cachedSegmentExpiration: 12 * 60 * 1000
          }
        });

        engine.on("peer_connect", () => {
          stats.peers++;
          console.log(`✅ Peer conectado | Total peers: ${stats.peers}`);
        });

        engine.on("peer_close", () => {
          stats.peers = Math.max(0, stats.peers - 1);
        });

        engine.on("segment_loaded", (segment, peerId) => {
          if (peerId) {
            stats.p2pSegments++;
          } else {
            stats.httpSegments++;
          }

          if ((stats.p2pSegments + stats.httpSegments) % 25 === 0) {
            console.log(`📊 P2P: ${stats.p2pPercent}% | Peers: ${stats.peers}`);
          }
        });

        console.log("✅ P2P Engine iniciado com sucesso");
        return engine;
      } catch (err) {
        console.warn("❌ Falha ao iniciar P2P:", err);
        return null;
      }
    }

    function createPlayer() {
      clearAllTimers();

      if (retryCount >= MAX_RETRIES) {
        showFatalError("Não foi possível conectar ao stream após várias tentativas.");
        return;
      }

      destroyPlayer();

      const activeSource = sources[currentSourceIndex];
      console.log(`🔄 Tentando fonte ${currentSourceIndex + 1}/${sources.length}`);

      if (!p2pEngine) {
        p2pEngine = initP2P();
      }

      const plugins = [];
      if (typeof LevelSelector !== "undefined") plugins.push(LevelSelector);
      if (typeof ClapprPip !== "undefined") plugins.push(ClapprPip);
      if (typeof ChromecastPlugin !== "undefined") plugins.push(ChromecastPlugin);

      try {
        player = new Clappr.Player({
          parentId: "#player",
          source: activeSource,
          poster: poster,
          width: "100%",
          height: "100%",
          autoPlay: true,
          mute: false,
          mediainfo: {
            title: canalId,
            description: "Live TV"
          },
          plugins: plugins,
          playback: {
            playInline: true,
            recycleVideo: true,
            hlsjsConfig: {
              loader: p2pEngine ? p2pEngine.createLoaderClass() : undefined,
              enableWorker: true,
              lowLatencyMode: true,
              liveSyncDurationCount: 2,
              liveMaxLatencyDurationCount: 5,
              maxBufferLength: 15,
              maxMaxBufferLength: 28,
              backBufferLength: 12,
              startLevel: -1,
              autoStartLoad: true,
              maxBufferHole: 0.5,
              highBufferWatchdogPeriod: 1.5,
              fragLoadingMaxRetry: 8,
              fragLoadingRetryDelay: 700,
              manifestLoadingMaxRetry: 6,
              levelLoadingMaxRetry: 6,
              abrEwmaDefaultEstimate: 700000
            }
          },
          chromecast: {
            appId: "9DFB77C0",
            media: {
              title: canalId,
              subtitle: "Live TV"
            }
          }
        });

        initialLoadTimer = setTimeout(() => {
          console.warn("⏰ Timeout de carregamento inicial");
          retryCount++;
          reconnect();
        }, 10000);

        player.on(Clappr.Events.PLAYER_PLAY, () => {
          clearAllTimers();
          retryCount = 0;
          console.log("▶️ Player iniciado");
        });

        player.on(Clappr.Events.PLAYBACK_BUFFERING, () => {
          clearTimeout(initialLoadTimer);
          bufferingTimer = setTimeout(() => {
            console.warn("⏰ Buffering demorou demais");
            retryCount++;
            reconnect();
          }, 14000);
        });

        player.on(Clappr.Events.PLAYBACK_BUFFERFULL, () => {
          clearTimeout(bufferingTimer);
        });

        const handleError = () => {
          retryCount++;
          reconnect();
        };

        player.on(Clappr.Events.PLAYER_ERROR, handleError);
        player.on(Clappr.Events.PLAYBACK_ERROR, handleError);

      } catch (e) {
        console.error("❌ Erro ao criar player:", e);
        retryCount++;
        reconnect();
      }
    }

    function reconnect() {
      clearAllTimers();

      if (retryCount >= MAX_RETRIES) {
        showFatalError("Tente recarregar a página.");
        return;
      }

      currentSourceIndex = (currentSourceIndex + 1) % sources.length;
      const delay = Math.min(1800 + (retryCount * 600), 6500);

      console.log(`🔄 Reconectando em ${delay}ms (tentativa ${retryCount})`);
      reconnectTimer = setTimeout(createPlayer, delay);
    }

    window.addEventListener("online", () => {
      console.log("🌐 Internet voltou");
      retryCount = 0;
      currentSourceIndex = 0;
      createPlayer();
    });

    window.addEventListener("beforeunload", () => {
      clearAllTimers();
      destroyPlayer();
    });

    createPlayer();
  })();
  </script>
</body>
</html>
