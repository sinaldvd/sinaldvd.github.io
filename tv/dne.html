<body>

    
    <div class="player_screen">
        <div id="loading"
            style="position: fixed;left: 0;top: 0;z-index: 10;width: 100%;height: 100%;background-color: hsla(240, 7%, 7%, 1.00);    display: flex;    justify-content: center;">
            <svg style="width: 6rem;z-index: 2;" xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'>
                <circle fill='#FD5D5D' stroke='#FD5D5D' stroke-width='15' r='15' cx='40' cy='65'>
                    <animate attributeName='cy' calcMode='spline' dur='2' values='65;135;65;' keySplines='.5 0 .5 1;.5 0 .5 1' repeatCount='indefinite' begin='-.4'></animate>
                </circle>
                <circle fill='#FD5D5D' stroke='#FD5D5D' stroke-width='15' r='15' cx='100' cy='65'>
                    <animate attributeName='cy' calcMode='spline' dur='2' values='65;135;65;' keySplines='.5 0 .5 1;.5 0 .5 1' repeatCount='indefinite' begin='-.2'></animate>
                </circle>
                <circle fill='#FD5D5D' stroke='#FD5D5D' stroke-width='15' r='15' cx='160' cy='65'>
                    <animate attributeName='cy' calcMode='spline' dur='2' values='65;135;65;' keySplines='.5 0 .5 1;.5 0 .5 1' repeatCount='indefinite' begin='0'></animate>
                </circle>
            </svg>

            </div>
        </div>
        <div class="player_container visible">
            <div id="video"></div>
        </div>
    </div>

    </div>

<script>

function getParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

const id = getParam("id");

if (!id) {
    document.body.innerHTML = "Canal não informado";
    throw new Error("ID não informado");
}

const source = `https://t5r4e3w2q1y0-cloudflare-net.vercel.app/${id}.m3u8`;

let data = {
    id: id,
    image: "",
    stream: source,
    p2p: null,
    player: null
};

let stats = {
    connectedPeers: 0,
    totalSegments: 0,
    p2pSegments: 0,
    httpSegments: 0,

    get loadPercent() {
        if (this.totalSegments === 0) return 0;

        return (
            (this.p2pSegments / this.totalSegments) * 100
        ).toFixed(1);
    }
};

function startPlayer(src) {

    try {

        const p2pConfig = {

            segments: {
                swarmId: "canal_" + data.id
            },

            loader: {

                trackerAnnounce: [
                    'wss://tracker.openwebtorrent.com',
                    'wss://tracker.novage.com.ua/announce',
                    'wss://tracker.webtorrent.dev/announce'
                ],

                rtcConfig: {
                    iceServers: [
                        {
                            urls: 'stun:stun.l.google.com:19302'
                        },
                        {
                            urls: 'stun:stun1.l.google.com:19302'
                        },
                        {
                            urls: 'stun:stun.cloudflare.com:3478'
                        }
                    ]
                },

                httpDownloadEnabled: true,
                httpDownloadProbability: 0.10,

                maxPeers: 80,
                simultaneousP2PDownloads: 12,
                downloadTimeout: 10000,

                cachedSegmentExpiration: 20 * 60 * 1000,
                cachedSegmentsCount: 800
            }
        };

        data.p2p = new p2pml.hlsjs.Engine(p2pConfig);

        data.p2p.on("peer_connect", (peer) => {

            stats.connectedPeers++;

            console.log(
                `✅ Peer conectado: ${peer.id}`
            );

        });

        data.p2p.on("peer_close", () => {

            stats.connectedPeers = Math.max(
                0,
                stats.connectedPeers - 1
            );

        });

        data.p2p.on("segment_loaded", (segment, peerId) => {

            stats.totalSegments++;

            if (peerId) {

                stats.p2pSegments++;

                console.log(
                    "%cP2P",
                    "color:lime",
                    segment.url
                );

            } else {

                stats.httpSegments++;

                console.log(
                    "%cHTTP",
                    "color:orange",
                    segment.url
                );
            }

            console.log(
                `📊 Peers: ${stats.connectedPeers} | P2P: ${stats.loadPercent}%`
            );

        });

    } catch (err) {

        console.warn(
            "❌ Falha ao inicializar P2P:",
            err
        );

        data.p2p = null;
    }

    data.player = new Clappr.Player({

        parentId: "#video",

        source: src,

        mimeType: "application/x-mpegURL",

        autoPlay: true,

        mute: true,

        width: "100%",

        height: "100%",

        preload: "auto",

        plugins: [ChromecastPlugin],

        chromecast: {

            appId: "9DFB77C0",

            media: {
                title: id,
                subtitle: "Live"
            }
        },

        playback: {

            playInline: true,

            hlsjsConfig: {

                loader: data.p2p
                    ? data.p2p.createLoaderClass()
                    : undefined,

                liveSyncDurationCount: 2,
                liveMaxLatencyDurationCount: 3,

                maxBufferLength: 20,
                maxMaxBufferLength: 40,

                backBufferLength: 0,

                startLevel: -1,

                autoStartLoad: true,

                maxBufferHole: 0.5,

                highBufferWatchdogPeriod: 2,

                fragLoadingMaxRetry: 5,
                fragLoadingRetryDelay: 1000,

                manifestLoadingRetryDelay: 1000,

                lowLatencyMode: true,

                abrEwmaDefaultEstimate: 500000
            }
        }
    });

    if (data.p2p) {
        p2pml.hlsjs.initClapprPlayer(data.player);
    }

    data.player.on(Clappr.Events.PLAYER_READY, () => {

        const video = document.querySelector("video");

        if (!video) return;

        video.muted = true;

        video.play().then(() => {

            setTimeout(() => {

                video.muted = false;

                data.player.setVolume(100);

            }, 1000);

        }).catch(err => {

            console.log(
                "Autoplay bloqueado:",
                err
            );

        });

    });

    data.player.on(
        Clappr.Events.PLAYER_ERROR,
        () => {

            console.log(
                "❌ Erro no stream, reconectando..."
            );

            setTimeout(() => {

                data.player.configure({

                    source:
                        source +
                        "?v=" +
                        Date.now()

                });

                data.player.play();

            }, 3000);

        }
    );

    $("[data-player]").append(
        '<a onclick="data.player.stop();data.player.play();" href="#" class="refresh">Travou? <b>Clique Aqui</b></a>'
    );

    data.player.play();

    setInterval(() => {

        if ($(".media-control-hide").length)
            $(".refresh").hide();
        else
            $(".refresh").show();

    }, 200);

}

$(function () {

    startPlayer(source);

});

</script>
