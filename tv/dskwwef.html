<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Player</title>

<link rel="preconnect" href="https://t5r4e3w2q1y0-cloudflare-net.vercel.app" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clappr@latest"></script>

<script src="https://cdn.jsdelivr.net/npm/clappr-chromecast-plugin@latest/dist/clappr-chromecast-plugin.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-core@latest/build/p2p-media-loader-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-hlsjs@latest/build/p2p-media-loader-hlsjs.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial, Helvetica, sans-serif;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#0f172a 0%,transparent 40%),
    radial-gradient(circle at bottom right,#111827 0%,transparent 40%),
    linear-gradient(135deg,#020617,#000000);
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    backdrop-filter:blur(60px);
    z-index:-1;
}

/* PLAYER AREA */

.player-wrapper{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.player-frame{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    border-radius:24px;
    background:#000;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:
    0 0 0 1px rgba(255,255,255,.03),
    0 20px 80px rgba(0,0,0,.6);
}

/* PLAYER */

#video{
    width:100%!important;
    height:100%!important;
    position:absolute;
    inset:0;
    overflow:hidden;
}

/* TOP BAR */

.topbar{
    position:absolute;
    top:18px;
    left:18px;
    right:18px;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:space-between;
    pointer-events:none;
}

.live-badge{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.08);
    padding:10px 16px;
    border-radius:999px;
    color:#fff;
    font-size:14px;
    backdrop-filter:blur(12px);
}

.live-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ff2d55;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.5);
        opacity:.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

.status-box{
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.08);
    padding:10px 16px;
    border-radius:999px;
    color:#fff;
    font-size:13px;
    backdrop-filter:blur(12px);
}

/* BUTTONS */

.action-buttons{
    position:absolute;
    right:20px;
    bottom:20px;
    z-index:999;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.action-btn{
    width:54px;
    height:54px;
    border-radius:18px;
    border:none;
    cursor:pointer;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(16px);
    color:#fff;
    font-size:20px;
    transition:.25s;
    border:1px solid rgba(255,255,255,.08);
}

.action-btn:hover{
    transform:scale(1.08);
    background:rgba(255,255,255,.15);
}

/* LOADING */

.loading-screen{
    position:absolute;
    inset:0;
    z-index:1000;
    background:#020617;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:25px;
}

.loader{
    width:90px;
    height:90px;
    border-radius:50%;
    border:6px solid rgba(255,255,255,.08);
    border-top-color:#00d4ff;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.loading-text{
    color:#fff;
    font-size:16px;
    letter-spacing:1px;
    opacity:.8;
}

/* CLAPPR CUSTOM */

.player-poster{
    background-size:cover!important;
}

.media-control{
    background:linear-gradient(to top,rgba(0,0,0,.8),transparent)!important;
}

.media-control[data-media-control] .bar-fill-1{
    background:#00d4ff!important;
}

.media-control[data-media-control] .bar-hover{
    background:#38bdf8!important;
}

.dvr-controls[data-dvr-controls] .live-info:before{
    background:#ff2d55!important;
}

.spinner-three-bounce[data-spinner] > div{
    background:#00d4ff!important;
}

svg path{
    fill:#ffffff!important;
}

/* MOBILE */

@media(max-width:768px){

    .player-wrapper{
        padding:0;
    }

    .player-frame{
        border-radius:0;
    }

    .topbar{
        top:12px;
        left:12px;
        right:12px;
    }

    .live-badge,
    .status-box{
        font-size:12px;
        padding:8px 12px;
    }

    .action-buttons{
        right:12px;
        bottom:12px;
    }

    .action-btn{
        width:48px;
        height:48px;
        border-radius:14px;
    }

}

</style>
</head>

<body>

<div class="player-wrapper">

    <div class="player-frame">

        <div class="loading-screen" id="loading">
            <div class="loader"></div>
            <div class="loading-text">
                CARREGANDO STREAM...
            </div>
        </div>

        <div class="topbar">

            <div class="live-badge">
                <span class="live-dot"></span>
                AO VIVO
            </div>

            <div class="status-box" id="status">
                Conectando...
            </div>

        </div>

        <div id="video"></div>

        <div class="action-buttons">

            <button class="action-btn" id="reloadBtn">
                ↻
            </button>

            <button class="action-btn" id="fullscreenBtn">
                ⛶
            </button>

        </div>

    </div>

</div>

<script>

function getParam(name){
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

const id = getParam("id");

if(!id){

    document.body.innerHTML = `
        <div style="
            width:100%;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#000;
            color:#fff;
            font-size:22px;
        ">
            Canal não informado
        </div>
    `;

    throw new Error("ID não informado");
}

const source =
`https://t5r4e3w2q1y0-cloudflare-net.vercel.app/${id}.m3u8`;

let data = {
    player:null,
    p2p:null
};

function updateStatus(text){
    document.getElementById("status").innerText = text;
}

function startPlayer(src){

    try{

        const engine = new p2pml.hlsjs.Engine({

            segments:{
                swarmId:"canal_" + id
            },

            loader:{

                trackerAnnounce:[
                    "wss://tracker.openwebtorrent.com",
                    "wss://tracker.webtorrent.dev",
                    "wss://tracker.novage.com.ua/announce"
                ],

                rtcConfig:{
                    iceServers:[
                        {
                            urls:"stun:stun.l.google.com:19302"
                        }
                    ]
                },

                maxPeers:80,
                httpDownloadProbability:0.10

            }

        });

        data.p2p = engine;

    }catch(e){

        console.log("P2P OFF",e);

    }

    data.player = new Clappr.Player({

        parentId:"#video",

        source:src,

        autoPlay:true,

        mute:true,

        width:"100%",

        height:"100%",

        preload:"auto",

        playsinline:true,

        plugins:[ChromecastPlugin],

        chromecast:{
            appId:"9DFB77C0"
        },

        playback:{
            playInline:true,

            hlsjsConfig:{

                loader:data.p2p
                    ? data.p2p.createLoaderClass()
                    : undefined,

                liveSyncDurationCount:2,
                liveMaxLatencyDurationCount:3,

                maxBufferLength:15,
                backBufferLength:0,

                fragLoadingMaxRetry:5,

                lowLatencyMode:true

            }
        }

    });

    if(data.p2p){
        p2pml.hlsjs.initClapprPlayer(data.player);
    }

    data.player.on(Clappr.Events.PLAYER_READY,()=>{

        updateStatus("Online");

        document.getElementById("loading").style.display = "none";

        const video = document.querySelector("video");

        if(video){

            video.setAttribute("playsinline","");
            video.setAttribute("webkit-playsinline","");

            video.muted = true;

            video.play()
            .then(()=>{

                setTimeout(()=>{

                    video.muted = false;

                    if(data.player){
                        data.player.setVolume(100);
                    }

                },1200);

            })
            .catch(()=>{

                updateStatus("Toque para iniciar");

            });

        }

    });

    data.player.on(Clappr.Events.PLAYER_ERROR,()=>{

        updateStatus("Reconectando...");

        setTimeout(()=>{

            data.player.configure({
                source:src + "?v=" + Date.now()
            });

            data.player.play();

        },3000);

    });

}

/* RELOAD */

document
.getElementById("reloadBtn")
.addEventListener("click",()=>{

    updateStatus("Recarregando...");

    if(data.player){

        data.player.stop();

        data.player.configure({
            source:source + "?reload=" + Date.now()
        });

        data.player.play();

    }

});

/* FULLSCREEN */

document
.getElementById("fullscreenBtn")
.addEventListener("click",()=>{

    const elem = document.documentElement;

    if(!document.fullscreenElement){

        elem.requestFullscreen();

    }else{

        document.exitFullscreen();

    }

});

$(function(){

    startPlayer(source);

});

</script>

</body>
</html>
