<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:ital,wght@0,700;1,700&family=Roboto+Mono:wght@500;700&display=swap">

    <style>
        :root {
            --brand: 255 87 87;
            --brand-fg: 255 255 255;
        }
    </style>

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: 'rgb(var(--brand) / <alpha-value>)',
                        'on-brand': 'rgb(var(--brand-fg) / <alpha-value>)',
                        panel: 'hsl(240 7% 10% / <alpha-value>)',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'system-ui', 'sans-serif'],
                        display: ['Roboto Condensed', 'Roboto', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style>
        [hidden] { display: none !important; }
        html, body { height: 100%; background: #000; overflow: hidden; }
        .range {
            -webkit-appearance: none; appearance: none; height: 4px; border-radius: 9999px;
            background: linear-gradient(to right, rgb(var(--brand)) var(--v), rgba(255,255,255,.25) var(--v));
            cursor: pointer;
        }
        .range::-webkit-slider-thumb {
            -webkit-appearance: none; height: 12px; width: 12px; border-radius: 9999px; background: #fff;
        }
        .range::-moz-range-thumb {
            height: 12px; width: 12px; border: 0; border-radius: 9999px; background: #fff;
        }
        .spinner { animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fade { transition: opacity .3s, visibility .3s; }
        .fade.is-hidden { opacity: 0; visibility: hidden; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.light.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "p2p-media-loader-core": "https://cdn.jsdelivr.net/npm/p2p-media-loader-core@2.2.2/dist/p2p-media-loader-core.es.min.js",
            "p2p-media-loader-hlsjs": "https://cdn.jsdelivr.net/npm/p2p-media-loader-hlsjs@2.2.2/dist/p2p-media-loader-hlsjs.es.min.js"
        }
    }
    </script>
</head>
<body class="font-sans text-white antialiased">

<div id="player" class="relative h-full w-full select-none overflow-hidden bg-black">

    <video data-ref="video" class="absolute inset-0 h-full w-full bg-black object-contain" playsinline></video>

    <div data-ref="loading" class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center gap-4 bg-black/40">
        <div class="spinner h-12 w-12 rounded-full border-[3px] border-white/15 border-t-brand"></div>
        <div class="text-xs uppercase tracking-[0.25em] text-white/60"></div>
    </div>

    <button type="button" data-ref="bigPlay" data-action="play" aria-label="Assistir"
        class="group absolute inset-0 z-10 flex items-center justify-center focus:outline-none">
        <svg class="h-20 w-20 text-white drop-shadow-[0_4px_24px_rgba(0,0,0,.6)] transition duration-200 group-hover:scale-110 group-hover:text-brand sm:h-28 sm:w-28" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11.13-6.86a1 1 0 0 0 0-1.72L9.5 4.28A1 1 0 0 0 8 5.14z"/>
        </svg>
    </button>

    <div data-ref="adLayer" hidden class="absolute inset-0 z-30 bg-black">
        <video data-ref="adVideo" class="h-full w-full bg-black object-contain" playsinline></video>
        <div class="pointer-events-none absolute left-3 top-3 rounded bg-black/60 px-2 py-1 text-xs font-bold uppercase tracking-wider text-white/90 sm:left-4 sm:top-4">
            Anúncio <span data-ref="adTime" class="ml-1 font-mono text-white/60"></span>
        </div>
        <button type="button" data-action="adToggle" aria-label="Pausar" class="absolute bottom-3 left-3 flex h-10 w-10 items-center justify-center rounded-full bg-black/50 hover:bg-white/10 sm:left-4">
            <svg data-ref="adIconPlay" hidden class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg data-ref="adIconPause" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <div class="absolute bottom-4 right-3 flex items-center gap-2 sm:right-4">
            <button type="button" data-action="adClick" data-ref="adLearn" class="rounded-full bg-black/60 px-4 py-2 text-xs font-bold text-white ring-1 ring-white/20 hover:bg-black/80">Saiba mais</button>
            <button type="button" data-action="adSkip" data-ref="adSkip" class="rounded-full bg-black/60 px-4 py-2 text-xs font-bold text-white ring-1 ring-white/20 hover:bg-black/80">Pular em 5</button>
        </div>
    </div>

    <div data-ref="error" hidden class="absolute inset-0 flex flex-col items-center justify-center bg-panel p-6 text-center">
        <div class="font-display text-3xl uppercase sm:text-5xl">Sinal indisponível</div>
        <p class="mt-2 max-w-sm text-sm text-white/50">Não conseguimos sintonizar o canal agora. Tente novamente em alguns instantes.</p>
        <button type="button" data-action="retry" class="mt-5 rounded-full bg-brand px-5 py-2.5 text-sm font-bold text-on-brand">Tentar novamente</button>
    </div>

    <button type="button" data-ref="refreshBtn" data-action="refresh" title="Travou? Atualizar a página"
        class="fade group absolute right-3 top-3 z-20 flex h-10 items-center gap-2 rounded-full bg-black/50 px-3 text-xs font-bold text-white/90 ring-1 ring-white/10 backdrop-blur-md transition hover:bg-black/70 hover:text-white sm:right-4 sm:top-4">
        <svg data-ref="refreshIcon" class="h-4 w-4 transition-transform duration-500 group-hover:rotate-180" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>
        <span>Atualizar</span>
    </button>

    <div data-ref="controls" class="fade absolute inset-x-0 bottom-0 z-20 bg-gradient-to-t from-black/85 via-black/40 to-transparent px-3 pb-3 pt-12 sm:px-4">
        <div class="flex items-center gap-1 sm:gap-2">
            <button type="button" data-ref="toggleBtn" data-action="toggle" class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-white/10" aria-label="Assistir">
                <svg data-ref="iconPlay" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg data-ref="iconPause" hidden class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>

            <div class="group flex items-center">
                <button type="button" data-action="toggleMute" class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-white/10" aria-label="Som">
                    <svg data-ref="iconVolume" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>
                    </svg>
                    <svg data-ref="iconMuted" hidden class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="m16 9 5 5m0-5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <input type="range" min="0" max="1" step="0.05" data-ref="volume"
                    class="range hidden w-0 opacity-0 transition-all duration-200 group-hover:w-20 group-hover:opacity-100 sm:block" aria-label="Volume">
            </div>

            <button type="button" data-ref="liveBtn" data-action="goLive" class="ml-1 flex items-center gap-2 rounded px-2 py-1 text-xs font-bold uppercase tracking-wider transition">
                <span data-ref="liveDot" class="h-2 w-2 rounded-full"></span>
                <span data-ref="liveText">Ao vivo</span>
            </button>

            <div class="ml-auto flex items-center gap-1 sm:gap-2">
                <div data-ref="delay" class="relative">
                    <button type="button" data-action="toggleDelayMenu" class="flex h-10 items-center gap-1.5 rounded-full px-3 text-xs font-bold hover:bg-white/10" aria-label="Delay">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
                            <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M10 2h4"/>
                        </svg>
                        <span data-ref="delayLabel" class="hidden sm:inline"></span>
                    </button>
                    <div data-ref="delayMenu" hidden class="absolute bottom-12 right-0 min-w-[14rem] overflow-hidden rounded-xl bg-panel/95 py-1 text-sm ring-1 ring-white/10 backdrop-blur">
                        <div class="px-4 pb-1 pt-2 text-[11px] font-bold uppercase tracking-wider text-white/40">Delay</div>
                        <button type="button" data-delay="performance" class="flex w-full items-center justify-between gap-4 px-4 py-2 text-left hover:bg-white/5">
                            <span><span class="block">Modo desempenho</span><span class="block text-xs text-white/40">4 segmentos · maior estabilidade</span></span>
                            <span class="text-brand">✓</span>
                        </button>
                        <button type="button" data-delay="balanced" class="flex w-full items-center justify-between gap-4 px-4 py-2 text-left hover:bg-white/5">
                            <span><span class="block">Modo equilibrado</span><span class="block text-xs text-white/40">2 segmentos · delay menor</span></span>

                <div data-ref="quality" hidden class="relative">
                    <button type="button" data-action="toggleMenu" class="flex h-10 items-center gap-1.5 rounded-full px-3 text-xs font-bold hover:bg-white/10" aria-label="Qualidade">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
                        </svg>
                        <span data-ref="qualityLabel"></span>
                    </button>
                    <div data-ref="menu" hidden class="absolute bottom-12 right-0 min-w-[9rem] overflow-hidden rounded-xl bg-panel/95 py-1 text-sm ring-1 ring-white/10 backdrop-blur"></div>
                </div>

                <button type="button" data-ref="pipBtn" data-action="pip" hidden class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-white/10" aria-label="Picture in picture">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/>
                    </svg>
                </button>

                <button type="button" data-action="fullscreen" class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-white/10" aria-label="Tela cheia">
                    <svg data-ref="iconFsEnter" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
                        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
                    </svg>
                    <svg data-ref="iconFsExit" hidden class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
                        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
(() => {
    const params = new URLSearchParams(location.search);
    const channelId = (params.get("id") || params.get("m") || "").trim().toLowerCase();
    if (!channelId) {
        document.body.innerHTML = '<div style="color:#fff;display:flex;height:100%;align-items:center;justify-content:center;font-family:sans-serif">ID do stream não informado</div>';
        return;
    }

    const AGENDA_URL = "https://%61%70%69%73%69%6E%61%6C%70%75%62%6C%69%63%6F.%76%65%72%63%65%6C.%61%70%70/agenda.json";
    const AD_CLICK_URL = "https://tr.ee/neurallinks";
    const AD_SKIP_SECONDS = 5;
    const AD_VIDEOS = [
        "https://calmcd3b.mpjaq3evvk.workers.dev/pasta/vid/1Ke3cf6006f5c.mp4",
        "https://calmcd3b.mpjaq3evvk.workers.dev/pasta/vid/2Ke3cf6006f5c.mp4",
        "https://calmcd3b.mpjaq3evvk.workers.dev/pasta/vid/3Ke3cf6006f5c.mp4",
        "https://calmcd3b.mpjaq3evvk.workers.dev/pasta/vid/4Ke3cf6006f5c.mp4",
        "https://calmcd3b.mpjaq3evvk.workers.dev/pasta/vid/5Ke3cf6006f5c.mp4",
        "https://calmcd3b.mpjaq3evvk.workers.dev/pasta/vid/6Ke3cf6006f5c.mp4"
    ];

    const STREAM_DOMAINS = [
        "https://o67y8q2v7r4k1.cloudflare-net.vercel.app",
        "https://m8q2v7r4k1-cloudflare-net.vercel.app",
        "https://u9q2v7r4k1-cloudflare-net.vercel.app",
        "https://i5r4e3w2q1y0-cloudflare-net.vercel.app",
        "https://i8q2v7r4k1-cloudflare-net.vercel.app",
        "https://a9b8c7d6e5f4-cloudflare-net.vercel.app",
        "https://t5r4e3w2q1y0-cloudflare-net.vercel.app"
    ];

    let streamIndex = 0;
    let src = `${STREAM_DOMAINS[0]}/${channelId}.m3u8`;

    const poster = `https://%69%6D%67.%66%61%7A-%6F-%65%6C%69.%6F%6E%6C%69%6E%65/${channelId}.prev.png`;
    document.querySelector('[data-ref="video"]').poster = poster;

    const P2P_TAG = '%c[P2P]';
    const P2P_CSS = 'color:#ff5757;font-weight:bold';
    const p2pLog = (...a) => console.log(P2P_TAG, P2P_CSS, ...a);
    const p2pWarn = (...a) => console.warn(P2P_TAG, P2P_CSS, ...a);

    const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    const p2pReady = IS_IOS ?
        (p2pLog('iOS: P2P desativado'), Promise.resolve(null)) :
        window.RTCPeerConnection ?
        import('p2p-media-loader-hlsjs')
            .then(m => {
                if (!window.Hls) return null;
                p2pLog('Biblioteca p2p-media-loader 2.2.2 carregada');
                return m.HlsJsP2PEngine.injectMixin(Hls);
            })
            .catch(err => (p2pWarn('Indisponível, usando só HTTP:', err), null)) :
        (p2pWarn('Navegador sem WebRTC, usando só HTTP'), Promise.resolve(null));

    const p2pStats = {
        peers: 0, p2pBytes: 0, httpBytes: 0, uploadBytes: 0, p2pSegments: 0, httpSegments: 0,
        get percent() {
            const t = this.p2pBytes + this.httpBytes;
            return t ? (this.p2pBytes / t * 100).toFixed(1) : '0.0';
        }
    };
    const mb = b => (b / 1048576).toFixed(2) + ' MB';
    const shortId = id => id ? String(id).slice(0, 8) : '?';

    function p2pSummary() {
        const s = p2pStats;
        p2pLog(`📊 Peers: ${s.peers} | P2P: ${s.percent}% | ↓ P2P ${mb(s.p2pBytes)} (${s.p2pSegments}) | ↓ HTTP ${mb(s.httpBytes)} (${s.httpSegments}) | ↑ ${mb(s.uploadBytes)}`);
    }

    function isValidTs(data) {
        const TS = 188;
        if (!data || data.byteLength < TS * 50 || data.byteLength % TS !== 0) return false;
        const bytes = new Uint8Array(data);
        const packets = bytes.length / TS;
        return [0, 1, Math.floor(packets / 2), packets - 1].every(i => bytes[i * TS] === 0x47);
    }

    function p2pConfig() {
        return {
            core: {
                swarmId: 'sinaldvd_' + channelId,
                announceTrackers: [
                    'wss://tracker.openwebtorrent.com',
                    'wss://tracker.novage.com.ua',
                    'wss://tracker.webtorrent.dev',
                ],
                rtcConfig: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun.cloudflare.com:3478' },
                        { urls: 'stun:global.stun.twilio.com:3478' },
                    ],
                },
                simultaneousP2PDownloads: 12,
                p2pNotReceivingBytesTimeoutMs: 1500,
                p2pErrorRetries: 1,
                validateP2PSegment: async (url, byteRange, data) => {
                    const ok = isValidTs(data);
                    if (!ok) p2pWarn(`🚫 Segmento inválido (${mb(data?.byteLength || 0)}), baixando por HTTP:`, url);
                    return ok;
                },
            },
            onHlsJsCreated(instance) {
                const engine = instance.p2pEngine;
                p2pLog(`Motor iniciado no swarm "sinaldvd_${channelId}"`);
                engine.addEventListener('onPeerConnect', ({ peerId }) => {
                    p2pStats.peers++;
                    p2pLog(`✅ Peer: ${shortId(peerId)} (total: ${p2pStats.peers})`);
                });
                engine.addEventListener('onPeerClose', ({ peerId }) => {
                    p2pStats.peers = Math.max(0, p2pStats.peers - 1);
                    p2pLog(`❌ Peer: ${shortId(peerId)} (total: ${p2pStats.peers})`);
                });
                engine.addEventListener('onSegmentLoaded', ({ bytesLength, downloadSource, peerId, segmentUrl }) => {
                    if (downloadSource === 'p2p') {
                        p2pStats.p2pBytes += bytesLength;
                        p2pStats.p2pSegments++;
                        console.log('%c⬇ peer %s', 'color:#22c55e', shortId(peerId), mb(bytesLength));
                    } else {
                        p2pStats.httpBytes += bytesLength;
                        p2pStats.httpSegments++;
                        console.log('%c⬇ http', 'color:#eab308', mb(bytesLength));
                    }
                    p2pSummary();
                });
                engine.addEventListener('onChunkUploaded', (bytesLength) => {
                    p2pStats.uploadBytes += bytesLength;
                });
            },
        };
    }
    window.__p2p = p2pStats;
    setInterval(() => { if (p2pStats.peers || p2pStats.uploadBytes) p2pSummary(); }, 30000);

    const root = document.getElementById('player');
    const ref = {};
    root.querySelectorAll('[data-ref]').forEach(el => ref[el.dataset.ref] = el);
    const video = ref.video;

    let hls = null;
    let idleTimer = null;
    let p2pOff = false;
    let loaded = false;
    let adBusy = false;
    let adSkipHandler = null;
    let adClickHandler = null;
    let showAdThisSession = false; 

    const state = {
        loading: false, playing: false, error: false, muted: false, volume: 1,
        atLive: true, idle: false, menu: null, delay: 'balanced',
        isFullscreen: false, pipSupported: !!document.pictureInPictureEnabled,
        levels: [], level: -1, currentHeight: null, retries: 0, started: false, adPlaying: false,
    };

    const DELAY_MODES = {
        performance: { label: 'Desempenho', segments: 4 },
        balanced: { label: 'Equilibrado', segments: 2 },
    };

    function set(patch) { Object.assign(state, patch); render(); }

    function qualityLabel() {
        if (state.level === -1) return state.currentHeight ? `Auto · ${state.currentHeight}p` : 'Auto';
        return state.levels[state.level]?.label ?? '';
    }

    function renderMenu() {
        const items = [{ i: -1, label: 'Automático' }, ...state.levels.map((lv, i) => ({ i, label: lv.label }))];
        ref.menu.replaceChildren(...items.map(({ i, label }) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'flex w-full items-center justify-between px-4 py-2 hover:bg-white/5';
            btn.dataset.level = i;
            const text = document.createElement('span'); text.textContent = label;
            const check = document.createElement('span'); check.className = 'text-brand'; check.textContent = '✓';
            check.toggleAttribute('hidden', state.level !== i);
            btn.append(text, ' ', check);
            return btn;
        }));
    }

    function render() {
        const s = state;
        const showBars = !s.idle || !s.playing;
        root.classList.toggle('cursor-none', s.idle && s.playing);
        ref.loading.toggleAttribute('hidden', !(s.loading && !s.error));
        ref.bigPlay.toggleAttribute('hidden', s.started || s.loading || s.error || s.adPlaying);
        ref.error.toggleAttribute('hidden', !s.error);
        ref.controls.classList.toggle('is-hidden', !(showBars && !s.error) || s.adPlaying);
        ref.adLayer.toggleAttribute('hidden', !s.adPlaying);
        ref.refreshBtn.classList.toggle('is-hidden', !showBars);
        ref.iconPlay.toggleAttribute('hidden', s.playing);
        ref.iconPause.toggleAttribute('hidden', !s.playing);
        ref.toggleBtn.setAttribute('aria-label', s.playing ? 'Pausar' : 'Assistir');
        const silent = s.muted || s.volume == 0;
        ref.iconVolume.toggleAttribute('hidden', silent);
        ref.iconMuted.toggleAttribute('hidden', !silent);
        ref.volume.value = s.volume;
        ref.volume.style.setProperty('--v', `${(s.muted ? 0 : s.volume) * 100}%`);
        ref.liveBtn.classList.toggle('text-white', s.atLive);
        ref.liveBtn.classList.toggle('cursor-default', s.atLive);
        ref.liveBtn.classList.toggle('text-white/50', !s.atLive);
        ref.liveBtn.classList.toggle('hover:text-white', !s.atLive);
        ref.liveBtn.title = s.atLive ? 'Ao vivo' : 'Voltar ao vivo';
        ref.liveDot.classList.toggle('bg-brand', s.atLive);
        ref.liveDot.classList.toggle('bg-white/40', !s.atLive);
        ref.liveText.textContent = s.atLive ? 'Ao vivo' : 'Voltar ao vivo';
        ref.quality.toggleAttribute('hidden', s.levels.length <= 1);
        ref.qualityLabel.textContent = qualityLabel();
        ref.menu.toggleAttribute('hidden', s.menu !== 'quality');
        ref.menu.querySelectorAll('[data-level]').forEach(btn => {
            btn.lastElementChild.toggleAttribute('hidden', Number(btn.dataset.level) !== s.level);
        });
        ref.delay.toggleAttribute('hidden', useNative());
        ref.delayLabel.textContent = DELAY_MODES[s.delay].label;
        ref.delayMenu.toggleAttribute('hidden', s.menu !== 'delay');
        ref.delayMenu.querySelectorAll('[data-delay]').forEach(btn => {
            btn.lastElementChild.toggleAttribute('hidden', btn.dataset.delay !== s.delay);
        });
        ref.pipBtn.toggleAttribute('hidden', !s.pipSupported);
        ref.iconFsEnter.toggleAttribute('hidden', s.isFullscreen);
        ref.iconFsExit.toggleAttribute('hidden', !s.isFullscreen);
    }

    async function checkAgendaForAd() {
        try {
            const res = await fetch(AGENDA_URL + '?t=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) throw new Error('agenda offline');
            const agenda = await res.json();
            const now = Date.now();
            const isLive = agenda.some(game => {
                if (!game.players || !Array.isArray(game.players)) return false;
                const starts = new Date(game.time_start).getTime();
                const ends = new Date(game.time_end).getTime();
                if (now < starts - 5 * 60 * 1000 || now > ends + 5 * 60 * 1000) return false;
                return game.players.some(url => {
                    try {
                        const u = new URL(url);
                        const id = (u.searchParams.get('id') || u.searchParams.get('m') || '').toLowerCase();
                        return id === channelId;
                    } catch { return false; }
                });
            });
            console.log('%c[AGENDA]%c ' + (isLive ? 'JOGO AO VIVO → anúncio ativo' : 'fora de horário → sem anúncio'),
                isLive ? 'background:#28a745;color:#fff;padding:2px 6px;border-radius:3px' : 'background:#6c757d;color:#fff;padding:2px 6px;border-radius:3px', '');
            return isLive;
        } catch (err) {
            console.warn('[AGENDA] erro, mostrando anúncio por segurança', err);
            return true;
        }
    }

    function runAd() {
        return new Promise(resolve => {
            let done = false;
            const adVideo = ref.adVideo;
            let order = AD_VIDEOS.slice().sort(() => Math.random() - 0.5);
            let idx = 0;
            let countdown = null;
            let loadTimer = null;

            const finish = (status) => {
                if (done) return;
                done = true;
                clearInterval(countdown);
                clearTimeout(loadTimer);
                adVideo.pause();
                adVideo.removeAttribute('src');
                adVideo.load();
                set({ adPlaying: false });
                console.log('[AD] finalizado:', status);
                resolve(status);
            };

            const startCountdown = () => {
                if (countdown) return;
                let left = AD_SKIP_SECONDS;
                ref.adSkip.textContent = `Pular em ${left}`;
                ref.adSkip.disabled = true;
                countdown = setInterval(() => {
                    left--;
                    if (left > 0) {
                        ref.adSkip.textContent = `Pular em ${left}`;
                    } else {
                        clearInterval(countdown);
                        ref.adSkip.textContent = 'Pular anúncio ›';
                        ref.adSkip.disabled = false;
                    }
                }, 1000);
            };

            const tryNext = (reason) => {
                console.warn('[AD] falhou:', order[idx], reason);
                clearTimeout(loadTimer);
                idx++;
                playNext();
            };

            const playNext = () => {
                if (idx >= order.length) {
                    ref.adTime.textContent = '';
                    startCountdown();
                    return;
                }
                const url = order[idx];
                console.log('[AD] tentando:', url);
                clearTimeout(loadTimer);
                loadTimer = setTimeout(() => tryNext('timeout'), 8000);
                adVideo.src = url;
                adVideo.muted = false;
                adVideo.play().catch(() => {
                    adVideo.muted = true;
                    adVideo.play().catch(() => tryNext('autoplay'));
                });
            };

            adVideo.onplaying = () => {
                clearTimeout(loadTimer);
                set({ adPlaying: true, loading: false });
                startCountdown();
            };
            adVideo.onended = () => finish('complete');
            adVideo.onerror = () => tryNext('error');
            adVideo.ontimeupdate = () => {
                const d = adVideo.duration, t = adVideo.currentTime;
                if (d > 0) ref.adTime.textContent = `${Math.max(0, Math.ceil(d - t))}s`;
            };

            const syncIcons = () => {
                ref.adIconPlay.toggleAttribute('hidden', !adVideo.paused);
                ref.adIconPause.toggleAttribute('hidden', adVideo.paused);
            };
            adVideo.onplay = syncIcons;
            adVideo.onpause = syncIcons;

            adSkipHandler = () => { if (!ref.adSkip.disabled) finish('skipped'); };
            adClickHandler = () => window.open(AD_CLICK_URL, '_blank', 'noopener');

            ref.adLearn.hidden = false;
            ref.adSkip.hidden = false;
            ref.adSkip.disabled = true;

            playNext();
        });
    }

    async function startWithAd() {
        if (adBusy) return;
        adBusy = true;
        set({ loading: true });

        if (showAdThisSession && AD_VIDEOS.length) {
            await runAd();
        }
        adBusy = false;
        load();
    }

    function useNative() {
        const native = !!video.canPlayType('application/vnd.apple.mpegurl');
        return native && !(window.Hls && Hls.isSupported());
    }

    async function load(reset = true) {
        loaded = true;
        if (reset) state.retries = 0;
        set({ error: false, loading: true });

        if (useNative()) {
            console.info('[player] Usando HLS nativo');
            return loadNative();
        }

        const HlsWithP2P = await p2pReady;
        if (window.Hls && Hls.isSupported()) {
            hls?.destroy();
            p2pStats.peers = 0;
            const useP2P = HlsWithP2P && !p2pOff;
            const HlsClass = useP2P ? HlsWithP2P : Hls;
            hls = new HlsClass({
                ...(useP2P ? { p2p: p2pConfig() } : {}),
                lowLatencyMode: true,
                liveSyncDurationCount: DELAY_MODES[state.delay].segments,
                maxBufferLength: 30,
                backBufferLength: 60,
                manifestLoadingMaxRetry: 1,
                levelLoadingMaxRetry: 2,
            });

            hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
                state.levels = data.levels
                    .map((lv, i) => ({ index: i, height: lv.height, label: lv.height ? `${lv.height}p` : `${Math.round(lv.bitrate / 1000)} kbps` }))
                    .filter(lv => lv.height || lv.label);
                renderMenu();
                render();
                startPlayback();
            });

            hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
                set({ currentHeight: hls.levels[data.level]?.height || null });
            });

            hls.on(Hls.Events.ERROR, (_, data) => {
                if (data.fatal) console.warn('[player] Erro HLS:', data.type, data.details);
                if (!data.fatal) {
                    if (data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) set({ loading: true });
                    return;
                }
                if (video.readyState < 3) set({ loading: true });

                if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    if (state.retries++ >= 3) return fail();
                    return hls.recoverMediaError();
                }

                if (streamIndex < STREAM_DOMAINS.length - 1) {
                    streamIndex++;
                    src = `${STREAM_DOMAINS[streamIndex]}/${channelId}.m3u8`;
                    console.warn('%c[FALLBACK]%c domínio alternativo → ' + STREAM_DOMAINS[streamIndex], 'background:#ffc107;color:#000;padding:2px 6px;border-radius:3px', '');
                    return setTimeout(() => load(false), 800);
                }

                if (state.started) {
                    if (state.retries++ >= 12) return fail();
                    return setTimeout(() => hls?.startLoad(), 5000);
                }
                if (state.retries++ >= 3) return fail();
                setTimeout(() => load(false), 1500 * state.retries);
            });

            hls.loadSource(src);
            hls.attachMedia(video);
        } else {
            fail();
        }
    }

    function loadNative() {
        hls?.destroy();
        hls = null;
        video.removeEventListener('error', onNativeError);
        video.addEventListener('error', onNativeError, { once: true });
        video.src = src;
        startPlayback();
    }

    function onNativeError() {
        if (streamIndex < STREAM_DOMAINS.length - 1) {
            streamIndex++;
            src = `${STREAM_DOMAINS[streamIndex]}/${channelId}.m3u8`;
            return setTimeout(() => load(false), 800);
        }
        if (state.retries++ >= 3) return fail();
        setTimeout(() => load(false), 1500 * state.retries);
    }

    function startPlayback() {
        video.muted = false;
        if (state.volume === 0) state.volume = 1;
        video.volume = state.volume;
        video.play().catch(() => set({ loading: false }));
    }

    function fail() {
        set({ error: true, loading: false, playing: false });
    }

    function play() {
        if (adBusy) return;
        if (!loaded) {
            if (!useNative()) video.play().catch(() => {});
            return startWithAd();
        }
        if (state.started && video.paused) return load();
        video.play().catch(() => {});
    }

    function toggle() { video.paused ? play() : video.pause(); }
    function mute() { video.muted = true; }
    function unmute() {
        video.muted = false;
        if (state.volume === 0) state.volume = 0.5;
        setVolume();
    }
    function setVolume() {
        video.volume = state.volume;
        video.muted = state.volume === 0;
        try { localStorage.setItem('player-volume', state.volume); } catch (e) {}
        render();
