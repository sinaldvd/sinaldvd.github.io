.range::-moz-range-thumb{height:12px;width:12px;border:0;border-radius:9999px;background:#fff}
.spinner{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{transition:opacity .3s,visibility .3s}
.fade.is-hidden{opacity:0;visibility:hidden}

.safe-x{padding-left:max(.75rem,env(safe-area-inset-left));padding-right:max(.75rem,env(safe-area-inset-right))}
.tap{position:absolute;top:0;bottom:0;width:30%;z-index:5}
video::-webkit-media-controls{display:none!important}

<body class="font-sans text-white antialiased">

<div id="player" class="relative h-full w-full select-none overflow-hidden bg-black">

<video data-ref="video" class="absolute inset-0 h-full w-full bg-black object-contain" playsinline webkit-playsinline x-webkit-airplay="allow" preload="none"></video>

<div class="absolute inset-0 z-[4]" data-ref="surface"></div>

<div data-ref="loading" class="pointer-events-none absolute inset-0 z-[6] flex flex-col items-center justify-center gap-4 bg-black/40">
<div class="spinner h-12 w-12 rounded-full border-[3px] border-white/15 border-t-brand"></div>
</div>

<button type="button" data-ref="bigPlay" data-action="play" aria-label="Assistir" class="group absolute inset-0 z-10 flex items-center justify-center focus:outline-none">
<svg class="h-20 w-20 text-white drop-shadow-[0_4px_24px_rgba(0,0,0,.6)] transition duration-200 group-hover:scale-110 group-hover:text-brand sm:h-28 sm:w-28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11.13-6.86a1 1 0 0 0 0-1.72L9.5 4.28A1 1 0 0 0 8 5.14z"/></svg>
</button>

<div data-ref="castLayer" hidden class="absolute inset-0 z-[8] flex flex-col items-center justify-center gap-3 bg-panel/95 p-6 text-center">
<svg class="h-14 w-14 text-brand" viewBox="0 0 24 24" fill="currentColor"><path d="M21 3H3a2 2 0 0 0-2 2v3h2V5h18v14h-7v2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM1 18v3h3a3 3 0 0 0-3-3zm0-4v2a5 5 0 0 1 5 5h2a7 7 0 0 0-7-7zm0-4v2a9 9 0 0 1 9 9h2A11 11 0 0 0 1 10z"/></svg>
<div class="font-display text-2xl uppercase sm:text-4xl">Transmitindo</div>
<p data-ref="castName" class="text-sm text-white/60"></p>
<button type="button" data-action="castStop" class="mt-2 rounded-full bg-brand px-5 py-2.5 text-sm font-bold text-on-brand">Parar transmissão</button>
</div>

<div data-ref="adLayer" hidden class="absolute inset-0 z-30 bg-black">
<video data-ref="adVideo" class="h-full w-full bg-black object-contain" playsinline webkit-playsinline></video>
<div class="pointer-events-none absolute left-3 top-3 rounded bg-black/60 px-2 py-1 text-xs font-bold uppercase tracking-wider text-white/90 safe-t">Anúncio <span data-ref="adTime" class="ml-1 text-white/60"></span></div>
<button type="button" data-action="adToggle" aria-label="Pausar" class="absolute bottom-4 left-3 flex h-11 w-11 items-center justify-center rounded-full bg-black/50 hover:bg-white/10 sm:left-4">
<svg data-ref="adIconPlay" hidden class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
<svg data-ref="adIconPause" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
</button>
<div class="absolute bottom-4 right-3 flex items-center gap-2 sm:right-4">
<button type="button" data-action="adClick" data-ref="adLearn" class="rounded-full bg-black/60 px-4 py-2.5 text-xs font-bold ring-1 ring-white/20 hover:bg-black/80">Saiba mais</button>
<button type="button" data-action="adSkip" data-ref="adSkip" class="rounded-full bg-black/60 px-4 py-2.5 text-xs font-bold ring-1 ring-white/20 hover:bg-black/80">Pular em 5</button>
</div>
</div>

<div data-ref="error" hidden class="absolute inset-0 z-[9] flex flex-col items-center justify-center bg-panel p-6 text-center">
<div class="font-display text-3xl uppercase sm:text-5xl">Sinal indisponível</div>
<p class="mt-2 max-w-sm text-sm text-white/50">Não conseguimos sintonizar o canal agora. Tente novamente em alguns instantes.</p>
<button type="button" data-action="retry" class="mt-5 rounded-full bg-brand px-5 py-2.5 text-sm font-bold text-on-brand">Tentar novamente</button>
</div>

<button type="button" data-ref="refreshBtn" data-action="refresh" title="Travou? Atualizar a página" class="fade safe-t absolute right-3 z-20 flex h-10 items-center gap-2 rounded-full bg-black/50 px-3 text-xs font-bold text-white/90 ring-1 ring-white/10 backdrop-blur-md hover:bg-black/70 sm:right-4">

<script>
(() => {
const params = new URLSearchParams(location.search);
const channelId = (params.get("id") || params.get("m") || "").trim().toLowerCase();
if (!channelId) {
  document.body.innerHTML = '<div style="color:#fff;display:flex;height:100%;align-items:center;justify-content:center;font-family:sans-serif">ID do stream não informado</div>';
  return;
}


const AGENDA_URL = "https://%61%70%69%73%69%6E%61%6C%70%75%62%6C%69%63%6F.%76%65%72%63%65%6C.%61%70%70/agenda.json";
const AD_CLICK_URL = "https://tr.ee/neurallinks";
const AD_SKIP_SECONDS = 5;
const AD_VIDEOS = [1,2,3,4,5,6].map(n => `https://calmcd3b.mpjaq3evvk.workers.dev/pasta/vid/${n}Ke3cf6006f5c.mp4`);
const STREAM_DOMAINS = [
  "https://o67y8q2v7r4k1.cloudflare-net.vercel.app",
  "https://m8q2v7r4k1-cloudflare-net.vercel.app",
  "https://u9q2v7r4k1-cloudflare-net.vercel.app",
  "https://i5r4e3w2q1y0-cloudflare-net.vercel.app",
  "https://i8q2v7r4k1-cloudflare-net.vercel.app",
  "https://a9b8c7d6e5f4-cloudflare-net.vercel.app",
  "https://t5r4e3w2q1y0-cloudflare-net.vercel.app"
];
const LIVE_THRESHOLD = 12;
const SEEK_STEP = 10;


let streamIndex = 0;
let src = `${STREAM_DOMAINS[0]}/${channelId}.m3u8`;
const poster = `https://%69%6D%67.%66%61%7A-%6F-%65%6C%69.%6F%6E%6C%69%6E%65/${channelId}.prev.png`;

const UA = navigator.userAgent;
const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_SAFARI = /^((?!chrome|android|crios|fxios|edg).)*safari/i.test(UA);
const IS_TOUCH = matchMedia('(pointer:coarse)').matches;


const p2pLog = (...a) => console.log('%c[P2P]', 'color:#ff5757;font-weight:bold', ...a);
const p2pWarn = (...a) => console.warn('%c[P2P]', 'color:#ff5757;font-weight:bold', ...a);
const p2pReady = (IS_IOS || !window.RTCPeerConnection) ? Promise.resolve(null) :
  import('p2p-media-loader-hlsjs')
    .then(m => window.Hls ? m.HlsJsP2PEngine.injectMixin(Hls) : null)
    .catch(err => (p2pWarn('Indisponível, usando só HTTP:', err), null));

const p2pStats = { peers: 0, p2pBytes: 0, httpBytes: 0, uploadBytes: 0 };
window.__p2p = p2pStats;

function isValidTs(data) {
  const TS = 188;
  if (!data || data.byteLength < TS * 50 || data.byteLength % TS !== 0) return false;
  const b = new Uint8Array(data), n = b.length / TS;
  return [0, 1, Math.floor(n / 2), n - 1].every(i => b[i * TS] === 0x47);
}

function p2pConfig() {
  return {
    core: {
      swarmId: 'sinaldvd_' + channelId,
      announceTrackers: ['wss://tracker.openwebtorrent.com','wss://tracker.novage.com.ua','wss://tracker.webtorrent.dev'],
      rtcConfig: { iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },
        { urls: 'stun:global.stun.twilio.com:3478' }] },
      simultaneousP2PDownloads: 12,
      p2pNotReceivingBytesTimeoutMs: 1500,
      p2pErrorRetries: 1,
      validateP2PSegment: async (url, br, data) => isValidTs(data),
    },
    onHlsJsCreated(instance) {
      const e = instance.p2pEngine;
      e.addEventListener('onPeerConnect', () => p2pStats.peers++);
      e.addEventListener('onPeerClose', () => p2pStats.peers = Math.max(0, p2pStats.peers - 1));
      e.addEventListener('onSegmentLoaded', ({ bytesLength, downloadSource }) => {
        if (downloadSource === 'p2p') p2pStats.p2pBytes += bytesLength; else p2pStats.httpBytes += bytesLength;
      });
      e.addEventListener('onChunkUploaded', b => p2pStats.uploadBytes += b);
    },
  };
}


const root = document.getElementById('player');
const ref = {};
root.querySelectorAll('[data-ref]').forEach(el => ref[el.dataset.ref] = el);
const video = ref.video;
video.poster = poster;
video.disableRemotePlayback = false;

let hls = null, idleTimer = null, p2pOff = false, loaded = false, adBusy = false;
let adSkipHandler = null, adClickHandler = null, showAdThisSession = false, wakeLock = null;

const state = {
  loading: false, playing: false, error: false, muted: false, volume: 1,
  atLive: true, idle: false, menu: null, delay: 'balanced',
  isFullscreen: false, pipSupported: !!document.pictureInPictureEnabled && !IS_TOUCH,
  levels: [], level: -1, currentHeight: null, retries: 0, started: false, adPlaying: false,
  castAvail: false, casting: false, castDevice: '', airAvail: false,
};
const DELAY_MODES = { performance: { label: 'Desempenho', segments: 4 }, balanced: { label: 'Equilibrado', segments: 2 } };

function set(patch) { Object.assign(state, patch); render(); }

function useNative() {
  const native = !!video.canPlayType('application/vnd.apple.mpegurl');

  if (native && (IS_IOS || IS_SAFARI)) return true;
  return native && !(window.Hls && Hls.isSupported());
}

function qualityLabel() {
  if (state.level === -1) return state.currentHeight ? `Auto · ${state.currentHeight}p` : 'Auto';
  return state.levels[state.level]?.label ?? '';
}

function renderMenu() {
  const items = [{ i: -1, label: 'Automático' }, ...state.levels.map((lv, i) => ({ i, label: lv.label }))];
  ref.menu.replaceChildren(...items.map(({ i, label }) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'flex w-full items-center justify-between px-4 py-2.5 hover:bg-white/5';
    btn.dataset.level = i;
    const t = document.createElement('span'); t.textContent = label;
    const c = document.createElement('span'); c.className = 'text-brand'; c.textContent = '✓';
    c.toggleAttribute('hidden', state.level !== i);
    btn.append(t, ' ', c);
    return btn;
  }));
}

function render() {
  const s = state;
  const showBars = (!s.idle || !s.playing) && !s.casting;
  root.classList.toggle('cursor-none', s.idle && s.playing && !IS_TOUCH);
  ref.loading.toggleAttribute('hidden', !(s.loading && !s.error && !s.casting));
  ref.bigPlay.toggleAttribute('hidden', s.started || s.loading || s.error || s.adPlaying || s.casting);
  ref.error.toggleAttribute('hidden', !s.error);
  ref.castLayer.toggleAttribute('hidden', !s.casting);
  ref.castName.textContent = s.casting ? `Reproduzindo em ${s.castDevice || 'dispositivo'}` : '';
  ref.controls.classList.toggle('is-hidden', !((showBars || s.casting) && !s.error) || s.adPlaying);
  ref.adLayer.toggleAttribute('hidden', !s.adPlaying);
  ref.refreshBtn.classList.toggle('is-hidden', !showBars || s.adPlaying);
  ref.iconPlay.toggleAttribute('hidden', s.playing);
  ref.iconPause.toggleAttribute('hidden', !s.playing);
  ref.toggleBtn.setAttribute('aria-label', s.playing ? 'Pausar' : 'Assistir');
  const silent = s.muted || s.volume == 0;
  ref.iconVolume.toggleAttribute('hidden', silent);
  ref.iconMuted.toggleAttribute('hidden', !silent);
  ref.volume.value = s.volume;
  ref.volume.style.setProperty('--v', `${(s.muted ? 0 : s.volume) * 100}%`);
  ref.liveBtn.classList.toggle('text-white', s.atLive);
  ref.liveBtn.classList.toggle('cursor-default', s.atLive);
  ref.liveBtn.classList.toggle('text-white/50', !s.atLive);
  ref.liveBtn.title = s.atLive ? 'Ao vivo' : 'Voltar ao vivo';
  ref.liveDot.classList.toggle('bg-brand', s.atLive);
  ref.liveDot.classList.toggle('bg-white/40', !s.atLive);
  ref.liveText.textContent = s.atLive ? 'Ao vivo' : 'Voltar ao vivo';
  ref.quality.toggleAttribute('hidden', s.levels.length <= 1);
  ref.qualityLabel.textContent = qualityLabel();
  ref.menu.toggleAttribute('hidden', s.menu !== 'quality');
  ref.menu.querySelectorAll('[data-level]').forEach(b => b.lastElementChild.toggleAttribute('hidden', Number(b.dataset.level) !== s.level));
  ref.delay.toggleAttribute('hidden', useNative());
  ref.delayLabel.textContent = DELAY_MODES[s.delay].label;
  ref.delayMenu.toggleAttribute('hidden', s.menu !== 'delay');
  ref.delayMenu.querySelectorAll('[data-delay]').forEach(b => b.lastElementChild.toggleAttribute('hidden', b.dataset.delay !== s.delay));
  ref.castBtn.toggleAttribute('hidden', IS_IOS || IS_SAFARI);
  ref.castIcon.classList.toggle('text-brand', s.casting);
  ref.airBtn.toggleAttribute('hidden', !(s.airAvail || !!video.webkitShowPlaybackTargetPicker));
  ref.pipBtn.toggleAttribute('hidden', !s.pipSupported);
  ref.iconFsEnter.toggleAttribute('hidden', s.isFullscreen);
  ref.iconFsExit.toggleAttribute('hidden', !s.isFullscreen);
}


async function checkAgendaForAd() {
  try {
    const res = await fetch(AGENDA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('agenda offline');
    const agenda = await res.json();
    const now = Date.now();
    return agenda.some(game => {
      if (!Array.isArray(game.players)) return false;
      const a = new Date(game.time_start).getTime(), b = new Date(game.time_end).getTime();
      if (now < a - 300000 || now > b + 300000) return false;
      return game.players.some(url => {
        try { const u = new URL(url); return (u.searchParams.get('id') || u.searchParams.get('m') || '').toLowerCase() === channelId; }
        catch { return false; }
      });
    });
  } catch { return true; }
}

function runAd() {
  return new Promise(resolve => {
    let done = false, idx = 0, countdown = null, loadTimer = null;
    const adVideo = ref.adVideo;
    const order = AD_VIDEOS.slice().sort(() => Math.random() - 0.5);

    const finish = status => {
      if (done) return;
      done = true;
      clearInterval(countdown); clearTimeout(loadTimer);
      adVideo.pause(); adVideo.removeAttribute('src'); adVideo.load();
      set({ adPlaying: false });
      resolve(status);
    };
    const startCountdown = () => {
      if (countdown) return;
      let left = AD_SKIP_SECONDS;
      ref.adSkip.textContent = `Pular em ${left}`;
      ref.adSkip.disabled = true;
      countdown = setInterval(() => {
        if (--left > 0) ref.adSkip.textContent = `Pular em ${left}`;
        else { clearInterval(countdown); ref.adSkip.textContent = 'Pular anúncio ›'; ref.adSkip.disabled = false; }
      }, 1000);
    };
    const tryNext = () => { clearTimeout(loadTimer); idx++; playNext(); };
    const playNext = () => {
      if (idx >= order.length) { finish('no-ad'); return; }   
      clearTimeout(loadTimer);
      loadTimer = setTimeout(tryNext, 8000);
      adVideo.src = order[idx];
      adVideo.muted = false;
      adVideo.play().catch(() => { adVideo.muted = true; adVideo.play().catch(tryNext); });
    };

    adVideo.onplaying = () => { clearTimeout(loadTimer); set({ adPlaying: true, loading: false }); startCountdown(); };
    adVideo.onended = () => finish('complete');
    adVideo.onerror = tryNext;
    adVideo.ontimeupdate = () => {
      const d = adVideo.duration, t = adVideo.currentTime;
      if (d > 0) ref.adTime.textContent = `${Math.max(0, Math.ceil(d - t))}s`;
    };
    const sync = () => {
      ref.adIconPlay.toggleAttribute('hidden', !adVideo.paused);
      ref.adIconPause.toggleAttribute('hidden', adVideo.paused);
    };
    adVideo.onplay = sync; adVideo.onpause = sync;
    adSkipHandler = () => { if (!ref.adSkip.disabled) finish('skipped'); };
    adClickHandler = () => window.open(AD_CLICK_URL, '_blank', 'noopener');
    ref.adSkip.disabled = true;
    playNext();
  });
}

async function startWithAd() {
  if (adBusy) return;
  adBusy = true;
  set({ loading: true });
  if (showAdThisSession && AD_VIDEOS.length && !state.casting) await runAd();
  adBusy = false;
  load();
}


function nextDomain() {
  if (streamIndex >= STREAM_DOMAINS.length - 1) return false;
  streamIndex++;
  src = `${STREAM_DOMAINS[streamIndex]}/${channelId}.m3u8`;
  return true;
}

async function load(reset = true) {
  if (state.casting) return;
  loaded = true;
  if (reset) state.retries = 0;
  set({ error: false, loading: true });

  if (useNative()) return loadNative();

  const HlsWithP2P = await p2pReady;
  if (!(window.Hls && Hls.isSupported())) return fail();

  hls?.destroy();
  p2pStats.peers = 0;
  const useP2P = HlsWithP2P && !p2pOff;
  const HlsClass = useP2P ? HlsWithP2P : Hls;
  hls = new HlsClass({
    ...(useP2P ? { p2p: p2pConfig() } : {}),
    lowLatencyMode: true,
    liveSyncDurationCount: DELAY_MODES[state.delay].segments,
    maxBufferLength: 30,
    backBufferLength: 60,
    manifestLoadingMaxRetry: 1,
    levelLoadingMaxRetry: 2,
  });

  hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
    state.levels = data.levels
      .map((lv, i) => ({ index: i, height: lv.height, label: lv.height ? `${lv.height}p` : `${Math.round(lv.bitrate / 1000)} kbps` }))
      .filter(lv => lv.height || lv.label);
    renderMenu(); render(); startPlayback();
  });
  hls.on(Hls.Events.LEVEL_SWITCHED, (_, d) => set({ currentHeight: hls.levels[d.level]?.height || null }));
  hls.on(Hls.Events.ERROR, (_, data) => {
    if (!data.fatal) {
      if (data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) set({ loading: true });
      return;
    }
    if (video.readyState < 3) set({ loading: true });
    if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
      if (state.retries++ >= 3) return fail();
      return hls.recoverMediaError();
    }
    if (nextDomain()) return setTimeout(() => load(false), 800);
    if (state.started) {
      if (state.retries++ >= 12) return fail();
      return setTimeout(() => hls?.startLoad(), 5000);
    }
    if (state.retries++ >= 3) return fail();
    setTimeout(() => load(false), 1500 * state.retries);
  });
  hls.loadSource(src);
  hls.attachMedia(video);
}

function loadNative() {
  hls?.destroy(); hls = null;
  video.removeEventListener('error', onNativeError);
  video.addEventListener('error', onNativeError, { once: true });
  video.src = src;
  video.load();
  startPlayback();
}
function onNativeError() {
  if (state.casting) return;
  if (nextDomain()) return setTimeout(() => load(false), 800);
  if (state.retries++ >= 3) return fail();
  setTimeout(() => load(false), 1500 * state.retries);
}

function startPlayback() {
  video.muted = false;
  if (state.volume === 0) state.volume = 1;
  video.volume = state.volume;
  video.play().catch(() => {

    video.muted = true;
    video.play().catch(() => set({ loading: false }));
  });
}
function fail() { set({ error: true, loading: false, playing: false }); }


function play() {
  if (adBusy) return;
  if (state.casting) return castPlayPause();
  if (!loaded) {
    if (!useNative()) video.play().catch(() => {});
    return startWithAd();
  }
  if (state.started && video.paused) return load();
  video.play().catch(() => {});
}
function toggle() {
  if (state.casting) return castPlayPause();
  video.paused ? play() : video.pause();
}
const mute = () => { video.muted = true; };
function unmute() {
  video.muted = false;
  if (state.volume === 0) state.volume = 0.5;
  setVolume();
}
function setVolume() {
  video.volume = state.volume;
  video.muted = state.volume === 0;
  if (state.casting && castPlayer) { try { castPlayer.volumeLevel = state.volume; castCtl.setVolumeLevel(); } catch {} }
  try { localStorage.setItem('player-volume', state.volume); } catch {}
  render();
}
function liveEdge() {
  return hls?.liveSyncPosition ?? (video.seekable.length ? video.seekable.end(video.seekable.length - 1) : null);
}
function checkLive() {
  const edge = liveEdge();
  if (edge == null) return;
  const atLive = edge - video.currentTime < LIVE_THRESHOLD;
  if (atLive !== state.atLive) set({ atLive });
}
function goLive() {
  const edge = liveEdge();
  if (edge != null && edge - video.currentTime > LIVE_THRESHOLD) video.currentTime = edge;
}
function seekBy(sec) {
  if (state.casting || !state.started) return;
  const edge = liveEdge();
  const target = video.currentTime + sec;
  const start = video.seekable.length ? video.seekable.start(0) : 0;
  video.currentTime = Math.max(start, edge != null ? Math.min(target, edge) : target);
}
function setLevel(i) {
  set({ level: i, menu: null });
  if (hls) hls.currentLevel = i === -1 ? -1 : state.levels[i].index;
}
function setDelay(mode) {
  if (!DELAY_MODES[mode]) return;
  const changed = mode !== state.delay;
  set({ delay: mode, menu: null });
  try { localStorage.setItem('player-delay', mode); } catch {}
  if (changed && state.playing) load();
}
function fullscreen() {
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  if (root.requestFullscreen) {
    root.requestFullscreen().then(() => {
      try { screen.orientation?.lock?.('landscape').catch(() => {}); } catch {}
    }).catch(() => {});
  } else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();  
}
function pip() {
  if (document.pictureInPictureElement) document.exitPictureInPicture().catch(() => {});
  else video.requestPictureInPicture?.().catch(() => {});
