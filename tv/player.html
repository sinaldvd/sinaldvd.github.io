  box-shadow:0 0 8px #00ff99;
  animation:livePulse 1.6s ease-in-out infinite;
}
@keyframes livePulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.55;transform:scale(.85)}
}

.media-control[data-media-control] .media-control-layer[data-controls] button.media-control-button[data-playstop]{
  float:left;
  display:none;
}

.media-control[data-media-control],
.media-control[data-media-control] button{opacity:1 !important}

.media-control[data-media-control] button[data-fullscreen] svg{display:none !important}

.media-control[data-media-control] button[data-fullscreen]{
  position:relative !important;
  width:48px !important;
  height:48px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  border-radius:8px !important;
  transition:background .2s ease,transform .12s ease;
}
.media-control[data-media-control] button[data-fullscreen]::before{
  content:"\f065";
  font-family:"Font Awesome 6 Free" !important;
  font-weight:900 !important;
  font-size:22px !important;
  color:#fff !important;
  opacity:1 !important;
  text-shadow:0 0 6px rgba(0,0,0,.4);
  transition:color .2s ease,transform .2s ease,text-shadow .2s ease;
}
.media-control[data-media-control] button[data-fullscreen]:hover{
  background:rgba(0,255,153,.10);
}
.media-control[data-media-control] button[data-fullscreen]:hover::before{
  color:#00ff99 !important;
  transform:scale(1.15);
  text-shadow:0 0 10px rgba(0,255,153,.6);
}
.media-control[data-media-control] button[data-fullscreen]:active{
  transform:scale(.93);
}
.media-control[data-media-control] button[data-fullscreen].fullscreen::before{
  content:"\f066";
}

.media-control[data-media-control] .media-control-layer[data-controls] .drawer-container[data-volume] .bar-container[data-volume] .segmented-bar-element[data-volume]{
  float:left;
  width:5px !important;
  padding-left:2px;
  height:22px !important;
  opacity:.5;
  box-shadow:inset 2px 0 0 #fff;
  transition:transform .2s ease-out,box-shadow .2s ease,opacity .2s ease;
}
.media-control[data-media-control] .media-control-layer[data-controls] .drawer-container[data-volume] .bar-container[data-volume] .segmented-bar-element[data-volume].fill{
  opacity:1;
  box-shadow:inset 2px 0 0 #00ff99;
}
.media-control[data-media-control] .media-control-layer[data-controls] .drawer-container[data-volume] .drawer-icon-container[data-volume] .drawer-icon[data-volume] svg{
  height:28px !important;
  position:relative;
  top:1px !important;
}

.media-control[data-media-control] .media-control-layer[data-controls] button.media-control-button svg{
  width:100%;
  height:24px !important;
  transition:filter .18s ease;
}
.media-control[data-media-control] .media-control-layer[data-controls] button.media-control-button:hover svg{
  filter:drop-shadow(0 0 4px rgba(0,255,153,.55));
}

#reloadFab button{
  display:none !important;
  transition:transform .2s ease,background .2s ease,border-color .22s ease;
}
#reloadFab button:hover{
  background:rgba(0,255,153,.10);
  border-color:#00ff99;
}
#reloadFab button:hover svg{color:#00ff99}

#svg-spinner,
.seek-disabled{display:none !important}
</style>
</head>
<body>

<div id="player-wrapper">
    <div id="player"></div>
</div>
	
<script>
function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
}

const canalId = getParam("id");

if (!canalId) {

    document.body.innerHTML = `
        <div style="
            width:100%;
            height:100%;
            display:flex;
            justify-content:center;
            align-items:center;
            color:#fff;
            font-family:Arial,sans-serif;
            font-size:22px;
            background:#000;
        ">
            Canal não informado
        </div>
    `;

    throw new Error("ID não informado");
}

const source =
    `https://t5r4e3w2q1y0-cloudflare-net.vercel.app/${canalId}.m3u8`;

let player;
let p2pEngine = null;

function createP2P() {

    if (
        typeof p2pml !== "undefined" &&
        p2pml.hlsjs &&
        p2pml.hlsjs.Engine
    ) {

        p2pEngine =
            new p2pml.hlsjs.Engine();

    }

}

function startPlayer() {

    createP2P();

    player = new Clappr.Player({

        parentId: "#player",

        source: source,

        mimeType:
            "application/x-mpegURL",

        width: "100%",

        height: "100%",

        autoPlay: true,

        mute: true,

        preload: "auto",

        mediacontrol: {
            seekbar: "#00ff99"
        },

        plugins:
            typeof ChromecastPlugin !==
            "undefined"
                ? [ChromecastPlugin]
                : [],

        chromecast: {

            appId: "9DFB77C0",

            media: {

                title: canalId,

                subtitle: "Live"

            }

        },

        playback: {

            playInline: true,

            recycleVideo: true,

            hlsjsConfig: {

                loader:
                    p2pEngine
                        ? p2pEngine.createLoaderClass()
                        : undefined,

                autoStartLoad: true,

                startPosition: -1,

                enableWorker: true,

                lowLatencyMode: true,

                liveSyncDurationCount: 2,

                liveMaxLatencyDurationCount: 4,

                maxLiveSyncPlaybackRate: 1.5,

                liveDurationInfinity: true,

                maxBufferLength: 20,

                maxMaxBufferLength: 40,

                backBufferLength: 0,

                fragLoadingMaxRetry: 5,

                fragLoadingRetryDelay: 1000,

                manifestLoadingMaxRetry: 5,

                manifestLoadingRetryDelay: 1000

            }

        }

    });

    if (
        p2pEngine &&
        typeof p2pml !== "undefined"
    ) {

        p2pml.hlsjs.initClapprPlayer(
            player
        );

    }

    player.on(
        Clappr.Events.PLAYER_READY,
        () => {

            console.log(
                "Player pronto"
            );

            try {

                player.play();

            } catch (e) {

                console.log(e);

            }

            const video =
                document.querySelector(
                    "video"
                );

            if (!video) return;

            video.play()

                .then(() => {

                    setTimeout(() => {

                        video.muted =
                            false;

                        player.unmute();

                        player.setVolume(
                            100
                        );

                    }, 1500);

                })

                .catch(err => {

                    console.log(
                        "Autoplay bloqueado:",
                        err
                    );

                });

        }
    );

    player.on(
        Clappr.Events.PLAYER_ERROR,
        () => {

            console.log(
                "Erro detectado. Reconectando..."
            );

            reconnect();

        }
    );

}

function liberarAudio() {

    if (!player) return;

    try {

        player.unmute();

        player.setVolume(100);

        player.play();

    } catch (e) {}

    document.removeEventListener(
        "click",
        liberarAudio
    );

    document.removeEventListener(
        "touchstart",
        liberarAudio
    );

}

document.addEventListener(
    "click",
    liberarAudio
);

document.addEventListener(
    "touchstart",
    liberarAudio
);

function reconnect() {

    if (!player) return;

    setTimeout(() => {

        try {

            player.stop();

            player.configure({

                source:
                    source +
                    "?v=" +
                    Date.now()

            });

            setTimeout(() => {

                player.play();

            }, 500);

        } catch (e) {

            console.error(e);

        }

    }, 3000);

}

document.addEventListener(
    "DOMContentLoaded",
    startPlayer
);

</script>

</body>
</html>
