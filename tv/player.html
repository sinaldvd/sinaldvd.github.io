    <div id="video"></div>
 <script>
    const params = new URLSearchParams(location.search);
    const rawId = params.get("id") || params.get("m") || "763";
    const isValidId = (str) => /^[a-zA-Z0-9_-]+$/.test(str);
    const canalId = isValidId(rawId) ? rawId : "763";

    const data = {
        id: canalId,
        image: `https://%69%6D%67.%66%61%7A-%6F-%65%6C%69.%6F%6E%6C%69%6E%65/${canalId}.prev.png`,
        referer: "https://sinaldvd.github.io/"
    };

    const sources = [
        `https://m8q2v7r4k1-cloudflare-net.vercel.app/${canalId}.m3u8`,
        `https://a9b8c7d6e5f4-cloudflare-net.vercel.app/${canalId}.m3u8`,
        `https://t5r4e3w2q1y0-cloudflare-net.vercel.app/${canalId}.m3u8`
    ];

    let player = null;

    function destroyPlayer() {
        if (player) {
            try {
                player.destroy();
            } catch (e) {}
            player = null;
        }
        $("#video").empty();
    }

    function startPlayer(srcIndex = 0) {
        if (srcIndex >= sources.length) {
            console.error("Erro");
            return;
        }

        const src = sources[srcIndex];
        destroyPlayer();

        player = new Clappr.Player({
            parentId: "#video",
            source: src,
            mimeType: "application/x-mpegURL",
            poster: data.image,
            width: "100%",
            height: "100%",
            autoPlay: true,
            mute: false,
            mediainfo: {
                title: canalId,
                description: "Live TV"
            },
            playback: {
                playInline: true,
                recycleVideo: true,
                hlsjsConfig: {
                    liveSyncDurationCount: 2,
                    liveMaxLatencyDurationCount: 3,
                    maxBufferLength: 20,
                    maxMaxBufferLength: 40,
                    backBufferLength: 0,
                    startLevel: -1,
                    autoStartLoad: true,
                    maxBufferHole: 0.5,
                    highBufferWatchdogPeriod: 2,
                    fragLoadingMaxRetry: 5,
                    fragLoadingRetryDelay: 1000,
                    manifestLoadingRetryDelay: 1000,
                    lowLatencyMode: true,
                    abrEwmaDefaultEstimate: 500000
                }
            },
            chromecast: {
                appId: "9DFB77C0",
                media: {
                    title: canalId,
                    subtitle: "Live TV"
                }
            }
        });

        player.on(Clappr.Events.PLAYER_ERROR, function () {
            console.warn("Erro", src);
            setTimeout(() => startPlayer(srcIndex + 1), 800);
        });
    }

    startPlayer(0);
</script>
