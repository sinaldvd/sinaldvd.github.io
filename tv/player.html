<script>
/* ─────────────────────────────────────────────
   UTILITÁRIOS
───────────────────────────────────────────── */
function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
}

const id = getParam("id");

if (!id) {
    document.body.innerHTML = '<div style="color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;font-size:18px;">Canal não informado</div>';
    throw new Error("ID não informado");
}

const source = `https://t5r4e3w2q1y0-cloudflare-net.vercel.app/${id}.m3u8`;

/* ─────────────────────────────────────────────
   ESTADO
───────────────────────────────────────────── */
let data = {
    id     : id,
    image  : "",
    stream : source,
    p2p    : null,
    player : null
};

let stats = {
    connectedPeers : 0,
    totalSegments  : 0,
    p2pSegments    : 0,
    httpSegments   : 0,
    get loadPercent() {
        if (this.totalSegments === 0) return 0;
        return ((this.p2pSegments / this.totalSegments) * 100).toFixed(1);
    }
};

/* ─────────────────────────────────────────────
   CAPTURA FRAME DO STREAM (via HLS + canvas)
───────────────────────────────────────────── */
function captureStreamFrame(src, onFrame) {
    // Cria um <video> oculto, carrega o stream e tira screenshot via canvas
    const vid = document.createElement("video");
    vid.crossOrigin   = "anonymous";
    vid.muted         = true;
    vid.playsInline   = true;
    vid.style.cssText = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;";
    document.body.appendChild(vid);

    // Usa Hls.js embutido no Clappr se disponível, ou nativo
    let hlsInstance = null;

    function tryNative() {
        vid.src = src;
    }

    if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({
            maxBufferLength       : 4,
            maxMaxBufferLength    : 8,
            startLevel            : 0,
            autoStartLoad         : true,
            lowLatencyMode        : true,
            startFragPrefetch     : true
        });
        hlsInstance.loadSource(src);
        hlsInstance.attachMedia(vid);
    } else {
        tryNative();
    }

    let captured = false;

    function doCapture() {
        if (captured) return;
        captured = true;

        const canvas  = document.createElement("canvas");
        canvas.width  = vid.videoWidth  || 1280;
        canvas.height = vid.videoHeight || 720;
        const ctx = canvas.getContext("2d");

        try {
            ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.85);

            // Verifica se não é frame totalmente preto (pode acontecer)
            const imgData = ctx.getImageData(0, 0, Math.min(canvas.width, 100), Math.min(canvas.height, 100));
            let sum = 0;
            for (let i = 0; i < imgData.data.length; i += 4) sum += imgData.data[i] + imgData.data[i+1] + imgData.data[i+2];

            if (sum < 500 && !dataUrl.startsWith("data:image")) {
                // Frame preto — tenta de novo em 1s
                captured = false;
                setTimeout(() => {
                    if (!captured) requestAnimationFrame(doCapture);
                }, 1000);
                return;
            }

            onFrame(dataUrl, true);
        } catch (e) {
            // CORS ou erro — notifica sem imagem
            onFrame(null, false);
        } finally {
            vid.pause();
            vid.src = "";
            if (hlsInstance) hlsInstance.destroy();
            document.body.removeChild(vid);
        }
    }

    // Tenta capturar quando tiver dados suficientes
    vid.addEventListener("timeupdate", function onTimeUpdate() {
        if (vid.currentTime > 0.5) {
            vid.removeEventListener("timeupdate", onTimeUpdate);
            doCapture();
        }
    });

    vid.addEventListener("canplay", () => {
        vid.play().catch(() => {});
    });

    // Fallback: timeout de 8 segundos
    setTimeout(() => {
        if (!captured) {
            captured = true;
            onFrame(null, false);
            vid.pause();
            vid.src = "";
            if (hlsInstance) { try { hlsInstance.destroy(); } catch(e){} }
            try { document.body.removeChild(vid); } catch(e){}
        }
    }, 8000);

    // Tenta dar play
    const playPromise = vid.play();
    if (playPromise) playPromise.catch(() => {});
}

/* ─────────────────────────────────────────────
   CONFIGURA O OVERLAY DE THUMB
───────────────────────────────────────────── */
function setupThumbOverlay(frameUrl) {
    const overlay  = document.getElementById("thumb-overlay");
    const bg       = document.getElementById("thumb-bg");
    const loading  = document.getElementById("thumb-loading");
    const playBtn  = document.getElementById("play-btn");
    const badge    = document.getElementById("live-badge");

    if (frameUrl) {
        bg.style.backgroundImage = `url("${frameUrl}")`;
    } else {
        // Sem frame: fundo escuro sólido com gradiente sutil
        bg.style.background = "radial-gradient(ellipse at 30% 40%, rgba(0,40,22,0.45) 0%, #050709 70%)";
    }

    // Esconde loader e mostra play + badge
    loading.style.display = "none";
    playBtn.style.display = "flex";
    badge.style.display   = "flex";

    // Clique no overlay dispara o player
    overlay.addEventListener("click", function onOverlayClick() {
        overlay.removeEventListener("click", onOverlayClick);
        overlay.classList.add("hidden");
        setTimeout(() => { overlay.style.display = "none"; }, 420);
        startPlayer(source);
    }, { once: true });
}

/* ─────────────────────────────────────────────
   PLAYER CLAPPR + P2P
───────────────────────────────────────────── */
function startPlayer(src) {

    // ── P2P ──
    try {
        const p2pConfig = {
            segments: { swarmId: "canal_" + data.id },
            loader: {
                trackerAnnounce: [
                    'wss://tracker.openwebtorrent.com',
                    'wss://tracker.novage.com.ua/announce',
                    'wss://tracker.webtorrent.dev/announce'
                ],
                rtcConfig: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun.cloudflare.com:3478' }
                    ]
                },
                httpDownloadEnabled      : true,
                httpDownloadProbability  : 0.10,
                maxPeers                 : 80,
                simultaneousP2PDownloads : 12,
                downloadTimeout          : 10000,
                cachedSegmentExpiration  : 20 * 60 * 1000,
                cachedSegmentsCount      : 800
            }
        };

        data.p2p = new p2pml.hlsjs.Engine(p2pConfig);

        data.p2p.on("peer_connect", (peer) => {
            stats.connectedPeers++;
            console.log(`✅ Peer conectado: ${peer.id}`);
        });

        data.p2p.on("peer_close", () => {
            stats.connectedPeers = Math.max(0, stats.connectedPeers - 1);
        });

        data.p2p.on("segment_loaded", (segment, peerId) => {
            stats.totalSegments++;
            if (peerId) {
                stats.p2pSegments++;
                console.log("%cP2P", "color:lime", segment.url);
            } else {
                stats.httpSegments++;
                console.log("%cHTTP", "color:orange", segment.url);
            }
            console.log(`📊 Peers: ${stats.connectedPeers} | P2P: ${stats.loadPercent}%`);
        });

    } catch (err) {
        console.warn("❌ Falha ao inicializar P2P:", err);
        data.p2p = null;
    }

    // ── CLAPPR ──
    data.player = new Clappr.Player({
        parentId : "#video",
        source   : src,
        mimeType : "application/x-mpegURL",
        autoPlay : true,
        mute     : false,
        width    : "100%",
        height   : "100%",
        preload  : "auto",

        plugins  : [ChromecastPlugin],
        chromecast: {
            appId : "9DFB77C0",
            media : { title: id, subtitle: "Live" }
        },

        playback: {
            playInline  : true,
            hlsjsConfig : {
                loader                   : data.p2p ? data.p2p.createLoaderClass() : undefined,
                liveSyncDurationCount    : 2,
                liveMaxLatencyDurationCount : 3,
                maxBufferLength          : 20,
                maxMaxBufferLength       : 40,
                backBufferLength         : 0,
                startLevel               : -1,
                autoStartLoad            : true,
                maxBufferHole            : 0.5,
                highBufferWatchdogPeriod : 2,
                fragLoadingMaxRetry      : 5,
                fragLoadingRetryDelay    : 1000,
                manifestLoadingRetryDelay: 1000,
                lowLatencyMode           : true,
                abrEwmaDefaultEstimate   : 500000
            }
        }
    });

    if (data.p2p) {
        p2pml.hlsjs.initClapprPlayer(data.player);
    }

    // Autoplay muted → unmute após 1s
    data.player.on(Clappr.Events.PLAYER_READY, () => {
        const video = document.querySelector("video");
        if (!video) return;
        video.muted = true;
        video.play()
            .then(() => {
                setTimeout(() => {
                    video.muted = false;
                    data.player.setVolume(100);
                }, 1000);
            })
            .catch(err => console.log("Autoplay bloqueado:", err));
    });

    // Reconexão automática em erro
    data.player.on(Clappr.Events.PLAYER_ERROR, () => {
        console.log("❌ Erro no stream, reconectando...");
        setTimeout(() => {
            data.player.configure({ source: source + "?v=" + Date.now() });
            data.player.play();
        }, 3000);
    });

    // Botão refresh
    $("[data-player]").append(
        '<a onclick="data.player.stop();data.player.play();" href="#" class="refresh">Travou? <b>Clique Aqui</b></a>'
    );

    data.player.play();

    setInterval(() => {
        if ($(".media-control-hide").length) $(".refresh").hide();
        else $(".refresh").show();
    }, 200);
}

/* ─────────────────────────────────────────────
   INIT — captura frame, depois aguarda clique
