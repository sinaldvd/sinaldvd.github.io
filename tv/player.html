    <!-- ==================== PROTEÇÃO ==================== -->
    <script>
    (function () {
        // Domínios que podem embedar o player (Site 1)
        const allowedDomains = [
            "sinalpublicoetv.vercel.app",
            "www.sinalpublicoetv.vercel.app"
        ];

        function extractHostname(url) {
            if (!url) return "";
            try {
                return new URL(url).hostname;
            } catch (e) {
                return url.split("/")[0];
            }
        }

        // Só permite se estiver em iframe do Site 1
        if (window.self === window.top) {
            // Aberto direto → redireciona
            window.location.replace("https://www.google.com");
            return;
        } else {
            const referrerHost = extractHostname(document.referrer);
            if (!allowedDomains.includes(referrerHost)) {
                window.location.replace("https://www.google.com");
                return;
            }
        }

        // Bloquear botão direito
        document.addEventListener("contextmenu", e => {
            e.preventDefault();
            return false;
        });

        // Bloquear atalhos
        document.addEventListener("keydown", e => {
            if (e.key === "F12" || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.shiftKey && ["I", "J", "C", "i", "j", "c"].includes(e.key)) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && (e.key === "u" || e.key === "U")) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && (e.key === "s" || e.key === "S")) {
                e.preventDefault();
                alert("PROIBIDO");
                return false;
            }
            if (e.ctrlKey && (e.key === "p" || e.key === "P")) {
                e.preventDefault();
                return false;
            }
        });

        // Detecção de DevTools
        function checkDevTools() {
            const threshold = 160;
            if (window.outerWidth - window.innerWidth > threshold ||
                window.outerHeight - window.innerHeight > threshold) {
                document.body.innerHTML = "Não abra as Ferramentas de Desenvolvedor.";
                window.location.replace("https://www.google.com");
            }
        }
        setInterval(checkDevTools, 1000);
    })();
    </script>

    <!-- ==================== PLAYER ==================== -->
    <script>
    (function(){
        const params = new URLSearchParams(window.location.search);
        const rawId = params.get("id") || params.get("m");

        const isValidId = (str) => /^[a-zA-Z0-9_-]+$/.test(str);
        if (!rawId || !isValidId(rawId)) {
            document.body.innerHTML = `
            <div style="color:#fff; text-align:center; padding:20px; font-family:sans-serif; position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#000;">
                <h2 style="color:#ff4444; margin-bottom:10px;">Canal não informado ou inválido</h2>
                <p>Use a URL com o parâmetro: <strong>?id=nome-do-canal</strong></p>
            </div>`;
            return;
        }

        const canalId = rawId;
        const sources = [
            `https://t5r4e3w2q1y0-cloudflare-net.vercel.app/${canalId}.m3u8`,
            `https://a9b8c7d6e5f4-cloudflare-net.vercel.app/${canalId}.m3u8`
        ];

        let currentSourceIndex = 0;
        const poster = `https://disret.disret.workers.dev/?url=https://img.faz-o-eli.online/${canalId}.prev.png`;
        let player = null;
        let reconnectTimer = null;
        let initialLoadTimer = null;
        let bufferingTimer = null;
        let retryCount = 0;
        const MAX_RETRIES = 5;

        function clearAllTimers() {
            clearTimeout(reconnectTimer);
            clearTimeout(initialLoadTimer);
            clearTimeout(bufferingTimer);
        }

        function showFatalError(message) {
            clearAllTimers();
            if (player) {
                player.destroy();
                player = null;
            }
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'color:#fff; text-align:center; padding:20px; font-family:sans-serif; position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#000; z-index:999;';
            errDiv.innerHTML = `<h2 style="color:#ff4444; margin-bottom:10px;">Erro na Transmissão</h2><p>${message}</p>`;
            document.body.appendChild(errDiv);
        }

        function createPlayer() {
            clearAllTimers();
            if (retryCount >= MAX_RETRIES) {
                showFatalError("Não foi possível conectar ao stream após várias tentativas.");
                return;
            }
            if (player) {
                player.destroy();
                player = null;
            }

            const activeSource = sources[currentSourceIndex];
            console.log(`[Player] Fonte ${currentSourceIndex + 1} (Tentativa ${retryCount + 1}):`, activeSource);

            const plugins = [];
            if (typeof LevelSelector !== "undefined") plugins.push(LevelSelector);
            if (typeof ClapprPip !== "undefined") plugins.push(ClapprPip);
            if (typeof ChromecastPlugin !== "undefined") plugins.push(ChromecastPlugin);

            try {
                player = new Clappr.Player({
                    parentId: "#player",
                    source: activeSource,
                    poster: poster,
                    width: "100%",
                    height: "100%",
                    autoPlay: true,
                    mute: false,
                    plugins: plugins,
                    playback: {
                        playInline: true,
                        recycleVideo: true,
                        hlsjsConfig: {
                            enableWorker: true,
                            lowLatencyMode: true,
                            liveSyncDurationCount: 3,
                            liveMaxLatencyDurationCount: 10,
                            maxBufferLength: 20,
                            maxMaxBufferLength: 30,
                            maxBufferHole: 0.5,
                            backBufferLength: 30
                        }
                    },
                    chromecast: {
                        appId: "9DFB77C0",
                        media: {
                            title: canalId,
                            subtitle: "Live TV"
                        }
                    }
                });

                initialLoadTimer = setTimeout(() => {
                    retryCount++;
                    reconnect();
                }, 10000);

                player.on(Clappr.Events.PLAYER_PLAY, () => {
                    clearAllTimers();
                    retryCount = 0;
                });

                player.on(Clappr.Events.PLAYBACK_BUFFERING, () => {
                    clearTimeout(initialLoadTimer);
                    bufferingTimer = setTimeout(() => {
                        retryCount++;
                        reconnect();
                    }, 15000);
                });

                player.on(Clappr.Events.PLAYBACK_BUFFERFULL, () => {
                    clearTimeout(bufferingTimer);
                });

                const handleError = () => {
                    retryCount++;
                    reconnect();
                };

                player.on(Clappr.Events.PLAYER_ERROR, handleError);
                player.on(Clappr.Events.PLAYBACK_ERROR, handleError);

            } catch (e) {
                retryCount++;
                reconnect();
            }
        }

        function reconnect() {
            clearAllTimers();
            if (retryCount >= MAX_RETRIES) {
                showFatalError("Tente recarregar a página.");
                return;
            }
            currentSourceIndex = (currentSourceIndex + 1) % sources.length;
            reconnectTimer = setTimeout(createPlayer, 3000);
        }

        window.addEventListener("online", () => {
            retryCount = 0;
            currentSourceIndex = 0;
            createPlayer();
        });

        window.addEventListener("beforeunload", () => {
            clearAllTimers();
            if (player) player.destroy();
        });

        createPlayer();
    })();
    </script>
