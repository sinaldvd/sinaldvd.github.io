<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="canonical" href="https://a9b8c7d6e5f4-cloudflare-net.vercel.app">
<link rel="canonical" href="https://t5r4e3w2q1y0-cloudflare-net.vercel.app">
<link rel="preconnect" href="https://a9b8c7d6e5f4-cloudflare-net.vercel.app" crossorigin>
<link rel="preconnect" href="https://t5r4e3w2q1y0-cloudflare-net.vercel.app" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clappr-chromecast-plugin@latest/dist/clappr-chromecast-plugin.min.js"></script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-core@latest/build/p2p-media-loader-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-hlsjs@latest/build/p2p-media-loader-hlsjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script type="text/javascript" src="https://ssl.p.jwpcdn.com/player/v/8.19.1/jwplayer.js"></script>
<script type="text/javascript"> jwplayer.key = "64HPbvSQorQcd52B8XFuhMtEoitbvY/EXJmMBfKcXZQU2Rnn"; </script>
<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#player{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#svg-spinner,
.seek-disabled{
    display:none !important;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}
</style>
</head>
<body>

<div id="player"></div>

<script>
(function(){

    const params = new URLSearchParams(window.location.search);
    const canalId = params.get("id") || params.get("canal");

    if(!canalId){
        document.body.innerHTML = `
        <div style="width:100%; height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; color:#fff; background:#000; font-family:Arial,sans-serif; text-align:center;">
            <h2>Canal não informado</h2>
            <span>Use ?id=canal</span>
        </div>`;
        return;
    }


    const sources = [
        `https://a9b8c7d6e5f4-cloudflare-net.vercel.app/${canalId}.m3u8`, 
        `https://a9b8c7d6e5f4-cloudflare-net.vercel.app/${canalId}.m3u8`  
    ];

    let currentSourceIndex = 0; 
    const poster = `https://disret.disret.workers.dev/?url=https://img.faz-o-eli.online/${canalId}.prev.png`;

    let player;
    let reconnectTimer;
    let loadTimeout; 

    function createPlayer(){

        clearTimeout(reconnectTimer);
        clearTimeout(loadTimeout);

        if(player){
            player.destroy();
        }


        const activeSource = sources[currentSourceIndex];
        console.log(`[Player] Tentando carregar fonte ${currentSourceIndex + 1}:`, activeSource);

        const plugins = [];
        if(typeof ChromecastPlugin !== "undefined"){
            plugins.push(ChromecastPlugin);
        }

        player = new Clappr.Player({
            parentId: "#player",
            source: activeSource,
            poster: poster,
            width: "100%",
            height: "100%",
            autoPlay: true, 
            mute: false,
            plugins: plugins,
            playback: {
                playInline: true,
                recycleVideo: true,
                hlsjsConfig: {
                    enableWorker: true,
                    lowLatencyMode: true,
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 10,
                    maxBufferLength: 20,
                    maxMaxBufferLength: 30,
                    maxBufferHole: 0.5,
                    backBufferLength: 30
                }
            },
            chromecast: {
                appId: "9DFB77C0",
                media: {
                    title: canalId,
                    subtitle: "Live TV"
                }
            }
        });


        loadTimeout = setTimeout(() => {
            console.log("[Player] Demorou muito para carregar (Timeout). Alternando fonte...");
            reconnect();
        }, 10000); 


        player.on(Clappr.Events.PLAYER_PLAY, () => {
            clearTimeout(loadTimeout);
            console.log("[Player] Reprodução iniciada com sucesso.");
        });
        
        player.on(Clappr.Events.PLAYER_READY, () => {
            clearTimeout(loadTimeout);
        });


        player.on(Clappr.Events.PLAYER_ERROR, function(error){
            console.log("[Player] Erro geral detectado, alternando fonte...", error);
            reconnect();
        });

        player.on(Clappr.Events.PLAYER_STOP, function(){
            console.log("[Player] Playback parado inesperadamente, alternando fonte...");
            reconnect();
        });

        player.on(Clappr.Events.PLAYBACK_ERROR, function(error){
            console.log("[Player] Erro de decodificação HLS, alternando fonte...", error);
            reconnect();
        });
    }

    function reconnect(){
        clearTimeout(reconnectTimer);
        clearTimeout(loadTimeout);
        

        currentSourceIndex = (currentSourceIndex + 1) % sources.length;
        
        console.log(`[Player] Aguardando 3 segundos para tentar a fonte ${currentSourceIndex + 1}...`);
        
        reconnectTimer = setTimeout(createPlayer, 3000); 
    }


    window.addEventListener("online", function(){
        console.log("[Player] Conexão restaurada. Resetando para a fonte principal.");
        currentSourceIndex = 0;
        createPlayer();
    });


    createPlayer();

})();
</script>

</body>
</html>
