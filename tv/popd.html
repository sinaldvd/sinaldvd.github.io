:root {

    <script>
    (function () {
        "use strict";

        const params = new URLSearchParams(window.location.search);
        const rawId = params.get("id") || params.get("m") || "";
        if (!rawId) {
            document.getElementById("player").innerHTML =
                '<div class="player-error">ID do stream não informado</div>';
            return;
        }

        const streamUrls = [
            `https://m8q2v7r4k1-cloudflare-net.vercel.app/${rawId}.m3u8`,
            `https://a9b8c7d6e5f4-cloudflare-net.vercel.app/${rawId}.m3u8`,
            `https://t5r4e3w2q1y0-cloudflare-net.vercel.app/${rawId}.m3u8`
        ];
        const poster = `https://%69%6D%67.%66%61%7A-%6F-%65%6C%69.%6F%6E%6C%69%6E%65/${rawId}.prev.png`;

        let engine = null;
        let healthMonitor = null;
        let player = null;
        let m3u8Url = streamUrls[0]; 
        let p2pReady = false;

        healthMonitor = {
            peers: 0,
            consecutiveErrors: 0,
            consecutiveSlowSegments: 0,
            p2pDownloads: 0,
            httpDownloads: 0,
            lastSegmentTime: 0,
            mode: "P2P_PREFERRED",
            MAX_ERRORS: 2,
            MAX_SLOW_SEGMENTS: 3,
            SEGMENT_TIMEOUT_MS: 2500,
            MIN_PEERS_FOR_P2P: 1,
            updateMode() {
                const old = this.mode;
                if (this.consecutiveErrors >= this.MAX_ERRORS || this.consecutiveSlowSegments >= this.MAX_SLOW_SEGMENTS) {
                    this.mode = "CDN_ONLY";
                } else if (this.peers < this.MIN_PEERS_FOR_P2P || this.consecutiveErrors > 0) {
                    this.mode = "HYBRID";
                } else {
                    this.mode = "P2P_PREFERRED";
                }
                if (old !== this.mode) {
                    console.log(`%c[MODE]%c ${old} → ${this.mode}`, "background:#ff6b6b;color:#fff;font-weight:bold;padding:2px 6px;border-radius:3px", "font-weight:bold");
                }
            },
            recordError() {
                this.consecutiveErrors++;
                this.updateMode();
            },
            recordSlowSegment() {
                this.consecutiveSlowSegments++;
                this.updateMode();
            },
            recordSuccess(isP2P) {
                if (isP2P && this.peers >= this.MIN_PEERS_FOR_P2P) {
                    this.consecutiveErrors = Math.max(0, this.consecutiveErrors - 1);
                    this.consecutiveSlowSegments = Math.max(0, this.consecutiveSlowSegments - 1);
                }
                if (isP2P) this.p2pDownloads++;
                else this.httpDownloads++;
                this.updateMode();
            },
            getStats() {
                const total = this.p2pDownloads + this.httpDownloads;
                return {
                    mode: this.mode,
                    peers: this.peers,
                    p2pPercent: total > 0 ? ((this.p2pDownloads / total) * 100).toFixed(1) : 0,
                    total
                };
            }
        };

        function createPlayer(source, useP2PLoader) {
            const hlsConfig = {
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                maxBufferSize: 30 * 1000 * 1000,
                maxBufferHole: 0.5,
                liveSyncDurationCount: 3,
                liveMaxLatencyDurationCount: 6,
                manifestLoadingTimeOut: 8000,
                manifestLoadingMaxRetry: 2,
                levelLoadingTimeOut: 8000,
                levelLoadingMaxRetry: 2,
                fragLoadingTimeOut: 15000,
                fragLoadingMaxRetry: 4,
                enableWorker: true,
                lowLatencyMode: false,
                backBufferLength: 20
            };

            if (useP2PLoader && engine) {
                hlsConfig.loader = engine.createLoaderClass();
            }

            if (player) {
                try { player.destroy(); } catch (e) {}
            }

            player = new Clappr.Player({
                parentId: "#player",
                source: source,
                mimeType: "application/x-mpegURL",
                poster: poster,
                autoPlay: true,
                width: "100%",
                height: "100%",
                plugins: [ChromecastPlugin, QualitySelector, Clappr.Poster],
                playback: {
                    hlsjsConfig: hlsConfig
                },
                events: {
                    onError: function () {
                        healthMonitor.recordError();
                        const idx = streamUrls.indexOf(m3u8Url);
                        const next = streamUrls[idx + 1];
                        if (next) {
                            console.warn("%c[FALLBACK]%c domínio alternativo", "background:#ffc107;color:#000;font-weight:bold;padding:2px 6px;border-radius:3px", "");
                            m3u8Url = next;
                            createPlayer(m3u8Url, p2pReady);
                        } else {
                            setTimeout(() => createPlayer(m3u8Url, p2pReady), 4000);
                        }
                    }
                },
                levelSelectorConfig: {
                    title: "Qualidade",
                    labels: { 2: "", 1: "", 0: "Mobile " },
                    defaultQuality: 0,
                    labelCallback: function (playbackLevel, customLabel) {
                        return customLabel + playbackLevel.level.height + "p";
                    }
                }
            });

            if (p2pReady && typeof p2pml !== "undefined") {
                try {
                    p2pml.hlsjs.initClapprPlayer(player);
                } catch (e) {}
            }

            player.setVolume(50);
            player.play();
        }

        createPlayer(m3u8Url, false);

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement("script");
                s.src = src;
                s.async = true;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        async function initP2P() {
            try {
                await Promise.all([
                    loadScript("https://cdn.jsdelivr.net/npm/p2p-media-loader-core@latest/build/p2p-media-loader-core.min.js"),
                    loadScript("https://cdn.jsdelivr.net/npm/p2p-media-loader-hlsjs@latest/build/p2p-media-loader-hlsjs.min.js")
                ]);

                const p2pSwarmId = window.P2P_SWARM_ID || "default-swarm";

                const config = {
                    segments: { swarmId: p2pSwarmId },
                    cachedSegmentExpiration: 86400000,
                    cachedSegmentsCount: 40,
                    simultaneousHttpDownloads: 2,
                    httpDownloadProbability: 0.15,
                    httpDownloadProbabilitySkipIfNoPeers: 0.8,
                    httpDownloadInitialTimeout: 2000,
                    httpDownloadTimeoutPerSegment: 1800,
                    simultaneousP2PDownloads: 2,
                    p2pDownloadTimeoutPerSegment: 2500,
                    loader: {
                        httpUseRanges: true,
                        requiredSegmentsPriority: 1,
                        trackerAnnounce: [
                            "wss://tracker.openwebtorrent.com",
                            "wss://tracker.webtorrent.dev"
                        ],
                        rtcConfig: {
                            iceServers: [
                                { urls: "stun:stun.l.google.com:19302" },
                                { urls: "stun:stun1.l.google.com:19302" }
                            ]
                        }
                    }
                };

                engine = new p2pml.hlsjs.Engine(config);
                console.log("%c[P2P]%c Engine iniciado em background", "background:#17a2b8;color:#fff;padding:2px 6px;border-radius:3px", "");

                const logStyles = {
                    connect: "background:#28a745;color:#fff;font-weight:bold;padding:2px 6px;border-radius:3px",
                    disconnect: "background:#dc3545;color:#fff;font-weight:bold;padding:2px 6px;border-radius:3px",
                    p2p: "background:#007bff;color:#fff;padding:2px 6px;border-radius:3px",
                    http: "background:#6c757d;color:#fff;padding:2px 6px;border-radius:3px",
                    error: "background:#ffc107;color:#000;font-weight:bold;padding:2px 6px;border-radius:3px",
                    slow: "background:#ff8c00;color:#fff;font-weight:bold;padding:2px 6px;border-radius:3px"
                };

                engine.on("peer_connect", peer => {
                    healthMonitor.peers++;
                    console.log(`%c[PEER+]%c ID: ${peer.id} | Total: ${healthMonitor.peers}`, logStyles.connect, "");
                    healthMonitor.updateMode();
                });
                engine.on("peer_close", peerId => {
                    healthMonitor.peers = Math.max(0, healthMonitor.peers - 1);
                    console.log(`%c[PEER-]%c ID: ${peerId} | Restantes: ${healthMonitor.peers}`, logStyles.disconnect, "");
                    healthMonitor.updateMode();
                });
                engine.on("segment_loaded", (segment, peerId) => {
                    const now = performance.now();
                    const dt = healthMonitor.lastSegmentTime > 0 ? now - healthMonitor.lastSegmentTime : 0;
                    healthMonitor.lastSegmentTime = now;
                    const name = segment.url.substring(segment.url.lastIndexOf("/") + 1);
                    const isP2P = !!peerId;
                    if (dt > healthMonitor.SEGMENT_TIMEOUT_MS) {
                        console.log(`%c[SLOW]%c ${name} (${(dt / 1000).toFixed(1)}s)`, logStyles.slow, "");
                        healthMonitor.recordSlowSegment();
                    }
                    console.log(isP2P ? `%c[P2P]%c ${name} (${healthMonitor.peers} peers)` : `%c[CDN]%c ${name}`, isP2P ? logStyles.p2p : logStyles.http, "");
                    healthMonitor.recordSuccess(isP2P);
                });
                engine.on("error", err => {
                    console.error("%c[ERROR]%c", logStyles.error, "", err);
                    healthMonitor.recordError();
                });

                setInterval(() => {
                    const s = healthMonitor.getStats();
                    console.log(`%c[STATS]%c ${s.mode} | Peers: ${s.peers} | P2P: ${s.p2pPercent}% (${s.total} segs)`, logStyles.http, "");
                }, 30000);

                p2pReady = true;

                if (player && player.isPlaying()) {

                    createPlayer(m3u8Url, true);
                }

                window.p2pStats = () => {
                    const s = healthMonitor.getStats();
                    console.table({
                        ...s,
                        p2pDownloads: healthMonitor.p2pDownloads,
                        httpDownloads: healthMonitor.httpDownloads
                    });
                    return s;
                };

            } catch (err) {
                console.warn("[P2P] Falha ao carregar, continuando só com CDN", err);
            }
        }


        if (document.readyState === "complete" || document.readyState === "interactive") {
            setTimeout(initP2P, 100);
        } else {
            window.addEventListener("DOMContentLoaded", () => setTimeout(initP2P, 100));
        }

    })();
